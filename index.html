var BANK = {"updated":"2026-10-29","sections":[{"id":"A","title":"甲部 · 指定文言經典篇章","desc":"佔全卷 30%（甲部為卷一全部試題，本 App 只收甲部）· 12 篇學習材料","groups":[{"id":"A-lunren","title":"論仁、論孝、論君子","sub":"《論語》· 語錄體","questions":[{"id":"A-lunren-1","tag":"詞解","stem":"「克己復禮為仁」一句中，「克」的意思是：","options":["克制、約束","戰勝","嚴格","能夠"],"answer":0,"explain":"「克己復禮」即約束自己的私慾，使言行合於禮。此處「克」作動詞，解作克制／約束，不可誤作「能夠」。","src":"模擬題"},{"id":"A-lunren-2","tag":"詞解","stem":"「仁者安仁，知者利仁」中，「利」的意思是：","options":["鋒利","認為……有利","順利","利益"],"answer":1,"explain":"「利」作意動用法：智者知道行仁對自己有利而行仁；仁者則安於仁道，無所企求。","src":"模擬題"},{"id":"A-lunren-3","tag":"內容理解","stem":"孟孫問孝，孔子答「無違」。「無違」是指不違背：","options":["父母的命令","老師的教誨","禮","自己的良心"],"answer":2,"explain":"孔子向樊遲補充：「生，事之以禮；死，葬之以禮，祭之以禮。」可見「無違」指不違背禮，而非盲從父母。","src":"模擬題"},{"id":"A-lunren-4","tag":"寫作手法","stem":"「君子坦蕩蕩，小人長戚戚」主要運用了：","options":["誇張","比喻","排比","對比"],"answer":3,"explain":"以君子與小人的心境作鮮明對比，突出君子心胸寬廣、小人患得患失，是《論語》刻畫君子品格的常用手法。","src":"模擬題"},{"id":"A-lunren-5","tag":"主旨","stem":"「君子喻於義，小人喻於利」旨在說明：","options":["義與利可以並存","君子完全不講利益","君子與小人的價值取向不同","小人亦有可取之處"],"answer":2,"explain":"「喻」解作明白、通曉。句意：君子明白的是道義，小人明白的是私利，凸顯二者價值取向的分別。","src":"模擬題"},{"id":"A-lunren-6","tag":"深層理解","stem":"「仁者安仁，知者利仁」，何者境界更高？最恰切的分析是：","options":["仁者更高：安於仁道而行仁，無所企求，純粹出於本性","知者更高：能審時度勢，知行合一","兩者境界相同，只是途徑不同","難分高下，視乎個人資質"],"answer":0,"explain":"仁者「安仁」是自然而然的實踐，無待於外；知者「利仁」仍帶有對利益的考量。故仁者境界更高一層。","src":"2025 DSE 卷一 甲部（考生回憶·改編）"},{"id":"A-lunren-7","tag":"內容理解","stem":"司馬牛問君子，孔子答「君子不憂不懼」，理由是君子：","options":["天命在身，自有庇佑","淡泊名利，與世無爭","地位崇高，無所畏懼","內省不疚，問心無愧"],"answer":3,"explain":"孔子曰：「內省不疚，夫何憂何懼？」重點在自我反省而無愧怍，非關外在際遇。","src":"模擬題"},{"id":"A-lunren-8","tag":"內容理解","stem":"「其為人也孝弟，而好犯上者，鮮矣」中，「孝弟」與「仁」的關係是：","options":["孝弟等同於仁","孝弟是實踐仁的根本","仁是孝弟的延伸","孝弟與仁無關"],"answer":1,"explain":"「孝弟也者，其為仁之本與」——孝悌是行仁的起點與根本，由親親而推及愛人。","src":"模擬題"},{"id":"A-lunren-9","tag":"詞解","stem":"「父母唯其疾之憂」中，「其」指代的是：","options":["醫者","子女","疾病","父母"],"answer":1,"explain":"「其」指子女。句意：父母只擔憂子女生病，故子女應愛惜身體，這便是孝。","src":"模擬題"},{"id":"A-lunren-10","tag":"內容理解","stem":"「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎？」強調孝重在：","options":["物質的供養","形式的周到","長時間的陪伴","內心的恭敬"],"answer":3,"explain":"以犬馬亦得飼養作反襯，說明僅供養而無敬意，則與養犬馬無別，敬是孝的核心。","src":"模擬題"},{"id":"A-lunren-11","tag":"詞解","stem":"子夏問孝，孔子答「色難」。「色」指的是：","options":["侍奉父母時的容貌態度","臉色難看","神色慌張","顏色繁多"],"answer":0,"explain":"「色難」謂侍奉父母時能常保和悅的容色最難，重在發自內心的敬愛。","src":"模擬題"},{"id":"A-lunren-12","tag":"內容理解","stem":"「事父母幾諫」中，「幾」的意思是：","options":["屢次","幾乎","輕微、委婉","機會"],"answer":2,"explain":"「幾」解作輕微、委婉。父母有過，應委婉規勸；若不被接納，仍恭敬不違，雖勞而不怨。","src":"模擬題"},{"id":"A-lunren-13","tag":"內容理解","stem":"「父母在，不遠遊，游必有方」的「方」意思是：","options":["方向","方法","理由","一定的去處"],"answer":3,"explain":"「方」指固定的去處、去向。父母在世不宜遠行，若不得已則須告知去處，以免父母憂慮。","src":"模擬題"},{"id":"A-lunren-14","tag":"詞解","stem":"「君子無終食之間違仁」中，「違」的意思是：","options":["錯誤","背離、離開","違抗","違約"],"answer":1,"explain":"終食之間即一頓飯的短暫時間。句意：君子連片刻也不會背離仁，可見仁須時刻堅守。","src":"模擬題"},{"id":"A-lunren-15","tag":"內容理解","stem":"「君子去仁，惡乎成名」一句的用意是：","options":["指出成名須靠學問","批評時人好名","強調仁是君子成名的必要條件","說明君子不重視名聲"],"answer":2,"explain":"「惡乎」即「於何」。捨棄仁則無以成就君子之名，反襯仁與君子名實不可分。","src":"模擬題"},{"id":"A-lunren-16","tag":"內容理解","stem":"「君子之於天下也，無適也，無莫也，義之與比」說明君子處事：","options":["以義為依歸，不預存好惡","無所適從，缺乏主見","隨波逐流，因時制宜","親疏有別，厚待親友"],"answer":0,"explain":"「適」親厚、「莫」疏遠、「比」依附。君子對天下事無固定親疏，只以義為衡量標準。","src":"模擬題"},{"id":"A-lunren-17","tag":"寫作手法","stem":"「君子求諸己，小人求諸人」運用的手法是：","options":["層遞","反問","對比","比喻"],"answer":2,"explain":"「求諸己」與「求諸人」對舉，凸顯君子重自省、小人苛責他人的分別。","src":"模擬題"},{"id":"A-lunren-18","tag":"內容理解","stem":"「君子和而不同，小人同而不和」中的「和」指：","options":["妥協退讓","意見完全一致","表面順從","和諧相處而不盲從附和"],"answer":3,"explain":"「和」是調和差異而共存；「同」是盲從一致。君子能容納異見而和諧，小人苟同卻內心不和。","src":"模擬題"},{"id":"A-lunren-19","tag":"內容理解","stem":"「君子泰而不驕，小人驕而不泰」中，「泰」的意思是：","options":["驕傲","安舒寬厚","泰然自若","奢侈"],"answer":1,"explain":"「泰」指心境安舒、態度寬厚；與「驕」相對，寫出君子舒泰而不盛氣凌人。","src":"模擬題"},{"id":"A-lunren-20","tag":"內容理解","stem":"「君子成人之美，不成人之惡」表現君子：","options":["助成別人的善事，不助長別人的惡行","喜歡讚美他人的外表","只與善人交往","凡事遷就他人"],"answer":0,"explain":"「成」謂助成。君子以促成他人之善為務，小人反是，與「君子坦蕩蕩」同屬君子品格的刻畫。","src":"模擬題"},{"id":"A-lunren-21","tag":"內容理解","stem":"「君子義以為質，禮以行之，孫以出之，信以成之」中，「孫」字：","options":["恭敬","通「遜」，謙遜","順從","子孫"],"answer":1,"explain":"「孫」通「遜」。四句分言君子以義為本質，依禮實行，以謙遜表達，以誠信完成。","src":"模擬題"},{"id":"A-lunren-22","tag":"深層理解","stem":"秦王已如約行事而相如仍不交璧，是否君子之行？若引《論君子》作答，最恰切的引文是：","options":["「孫以出之」","「禮以行之」","「信以成之」","「義以為質」"],"answer":2,"explain":"「信以成之」強調以誠信完成其事。相如既有「完璧歸趙」之約在先，踐約即合君子之義。","src":"模擬題"},{"id":"A-lunren-23","tag":"寫作手法","stem":"《論語》三章大量運用排比、對偶與對比，其效果主要是：","options":["句式整齊，節奏鮮明，道理更为警策易記","使篇幅加長","使論證更客觀","使語意含蓄"],"answer":0,"explain":"語錄體以短句為主，排比對偶令道理簡勁有力、琅琅上口，故能流傳久遠。","src":"模擬題"},{"id":"A-lunren-24","tag":"主旨","stem":"綜合三章，孔子所說的「君子」最核心的特質是：","options":["能言善辯，長於處世","博學多聞，才華出眾","地位尊貴，受人敬重","以仁義為本，反求諸己而心胸坦蕩"],"answer":3,"explain":"三章分論仁、孝、君子，歸結於內在的仁義修為，而非外在的才學地位。","src":"模擬題"}]},{"id":"A-yu","title":"魚我所欲也","sub":"《孟子·告子上》· 論說","questions":[{"id":"A-yu-1","tag":"詞解","stem":"「所欲有甚於生者，故不為苟得也」中，「苟得」的意思是：","options":["勉強得到","苟且求得（苟且偷生）","多餘的收穫","隨便給予"],"answer":1,"explain":"「苟得」指不擇手段、苟且地取得。有比生命更重要的東西（義），故不肯苟且求生。","src":"模擬題"},{"id":"A-yu-2","tag":"詞解","stem":"「萬鍾於我何加焉」中，「萬鍾」借指：","options":["高大的房屋","眾多的禮物","優厚的俸祿","大量的糧食"],"answer":2,"explain":"「鍾」是古量器，「萬鍾」形容俸祿豐厚，屬借代。","src":"模擬題"},{"id":"A-yu-3","tag":"文言基礎","stem":"「鄉為身死而不受」中，「鄉」字屬於：","options":["偏義複詞","古今異義","詞類活用","通假字，通「向」，從前"],"answer":3,"explain":"「鄉」通「向」，解作從前、昔日，與「今」相對，形成今昔對比。","src":"模擬題"},{"id":"A-yu-4","tag":"內容理解","stem":"「此之謂失其本心」中，「本心」指的是：","options":["最初的志向","仁愛惻隱之心","羞惡之心、捨生取義之心","求生的本能"],"answer":2,"explain":"孟子主張人性本善，人天生有「所欲有甚於生者」的羞惡之心；為物欲而受不義之祿即失其本心。","src":"模擬題"},{"id":"A-yu-5","tag":"論證手法","stem":"開篇以「魚與熊掌」設喻，作用是：","options":["以比喻論證引出「捨生取義」的中心論點","以對比論證批駁論敵","以引用論證增強權威","以舉例論證說明飲食之道"],"answer":0,"explain":"以生活化的取捨比喻，把抽象的「生」與「義」具體化，自然帶出「捨生而取義」。","src":"模擬題"},{"id":"A-yu-6","tag":"內容理解","stem":"「生亦我所欲，所欲有甚於生者，故不為苟得也」中的「甚於生者」指：","options":["學問","名利","親情","義"],"answer":3,"explain":"「甚於生者」即比生命更重要的「義」，故寧死不義；與下文「所惡有甚於死者」指「不義」相對。","src":"模擬題"},{"id":"A-yu-7","tag":"內容理解","stem":"「所惡有甚於死者，故患有所不辟也」中，「辟」字：","options":["開闢","通「避」，躲避","偏僻","刑法"],"answer":1,"explain":"「辟」通「避」。句意：有比死亡更可惡的事（不義），所以有的禍患並不躲避。","src":"模擬題"},{"id":"A-yu-8","tag":"論證手法","stem":"「如使人之所欲莫甚於生，則凡可以得生者何不用也？」運用的句式是：","options":["對偶，句式整齊","假設反問，從反面推論以凸顯本心之實有","設問，自問自答","排比，增強語勢"],"answer":1,"explain":"先假設人無「甚於生者」之欲，則求生手段無所不用其極；再以「由是則生而有不用也」反證本心確實存在。","src":"模擬題"},{"id":"A-yu-9","tag":"內容理解","stem":"「由是則生而有不用也，由是則可以辟患而有不為也」說明：","options":["避患須講求方法","求生是人的本能","人往往不知取捨","人有重義輕生之心，並非只求苟活"],"answer":3,"explain":"「由是」指用某種手段。有人寧死不用此手段，可見其心中義重於生，是孟子人性本善的重要論據。","src":"模擬題"},{"id":"A-yu-10","tag":"內容理解","stem":"「非獨賢者有是心也，人皆有之，賢者能勿喪耳」中，「是心」指：","options":["捨生取義的羞惡之心","恭敬之心","惻隱之心","是非之心"],"answer":0,"explain":"「是心」承上文，指「所欲有甚於生者」之心。孟子強調此心人人皆有，賢者只是能不喪失罷了。","src":"模擬題"},{"id":"A-yu-11","tag":"內容理解","stem":"「呼爾而與之，行道之人弗受」中，「呼爾」形容：","options":["大聲讚美","輕聲呼喚","吆喝著、無禮地呼喝","急速地"],"answer":2,"explain":"「呼爾」狀無禮呼喝之態。連路人也不屑接受，可見人格尊嚴重於飲食。","src":"模擬題"},{"id":"A-yu-12","tag":"內容理解","stem":"「蹴爾而與之，乞人不屑也」中，「蹴」的意思是：","options":["催促","踐踏莊稼","用手扔","用腳踢"],"answer":3,"explain":"「蹴」即用腳踢。以乞人亦不屑，極言侮辱性施捨之不可受，襯出「義」重於「生」。","src":"模擬題"},{"id":"A-yu-13","tag":"文言基礎","stem":"「萬鍾則不辯禮義而受之」中，「辯」字：","options":["辯論","通「辨」，辨別","說明","爭辯"],"answer":1,"explain":"「辯」通「辨」。句意：萬鍾之祿卻不分辨是否合於禮義就接受了。","src":"模擬題"},{"id":"A-yu-14","tag":"內容理解","stem":"文中列舉「宮室之美、妻妾之奉、所識窮乏者得我與」，目的是：","options":["列舉賢者的追求","讚美富貴生活","指出世人為物欲而接受不義之祿的三種原因","說明物質享受的重要"],"answer":2,"explain":"三者皆為外在誘惑，與「鄉為身死而不受」形成今昔對比，質問其是否為物欲而失本心。","src":"模擬題"},{"id":"A-yu-15","tag":"文言基礎","stem":"「所識窮乏者得我與」中，「得」字：","options":["通「德」，感激","得到","獲得","能夠"],"answer":0,"explain":"「得」通「德」，作動詞，解作感激。句意：所認識的窮困者感激我嗎？","src":"模擬題"},{"id":"A-yu-16","tag":"內容理解","stem":"「是亦不可以已乎？」一句的語氣與作用是：","options":["設問，引起下文","感嘆，抒發悲憤","反問，譴責其不應為物欲而失本心","疑問，表示不解"],"answer":2,"explain":"「已」即停止。以反問作結，語氣峻切，逼使讀者自省，為「失其本心」的斷語蓄勢。","src":"模擬題"},{"id":"A-yu-17","tag":"主旨","stem":"《魚我所欲也》的中心論點是：","options":["重利輕義","知足常樂","義利並重","捨生取義"],"answer":3,"explain":"全文由魚與熊掌之喻帶出「捨生而取義」，再反覆論證，末以「失其本心」作結。","src":"模擬題"},{"id":"A-yu-18","tag":"寫作手法","stem":"本文大量運用排比與對比，其主要效果是：","options":["使文章篇幅加長","氣勢充沛，層層推進，說理極具說服力","使語意含蓄委婉","使議論更為客觀"],"answer":1,"explain":"「鄉為身死而不受，今為宮室之美為之」一連三組對比排比，咄咄逼人，是先秦論說文的典型風格。","src":"模擬題"},{"id":"A-yu-19","tag":"修辭","stem":"「魚，我所欲也；熊掌，亦我所欲也」運用的句式是：","options":["判斷句（……也）","疑問句","感嘆句","被動句"],"answer":0,"explain":"「……也」為判斷句標誌。以判斷句羅列所欲，語氣肯定，為下文的取捨設問鋪墊。","src":"模擬題"},{"id":"A-yu-20","tag":"深層理解","stem":"「熊掌」在文中的作用，最恰切的理解是：","options":["與魚形成對比，取其一","以珍貴之物襯托「義」的更為可貴","說明飲食講究","比喻功名利祿"],"answer":1,"explain":"魚與熊掌皆我所欲，取熊掌即「捨魚」；同理，義與生不可得兼則「捨生取義」。喻體為論點服務。","src":"模擬題"},{"id":"A-yu-21","tag":"論證手法","stem":"文中「行道之人」「乞人」之例，屬何種論證？","options":["對比論證","比喻論證","舉例論證：以最卑微者亦知恥，證明義重於生","引用論證"],"answer":2,"explain":"連路人與乞丐也不肯受辱，可見重義之心人皆有之，以實例加強「人皆有之」的可信度。","src":"模擬題"},{"id":"A-yu-22","tag":"文言基礎","stem":"下列「與」字作語氣助詞（同「歟」）用的是：","options":["所識窮乏者得我與","與朋友交","與其坐而待斃","呼爾而與之"],"answer":0,"explain":"A句末「與」通「歟」，表疑問語氣；B為動詞「給」；C為介詞「和」；D為連詞「與其」。","src":"模擬題"}]},{"id":"A-xiaoyao","title":"逍遙遊（節錄）","sub":"《莊子》· 寓言論說","questions":[{"id":"A-xiaoyao-1","tag":"內容理解","stem":"惠子以「大瓠」為喻，其目的是：","options":["讚美莊子學問淵博","表達自己不慕名利","諷刺莊子的學說大而無用","說明種植之法"],"answer":2,"explain":"惠子藉大瓠無所用而剖之，暗指莊子言論宏大卻不切實用，為莊子反駁「用大」之說作鋪墊。","src":"2021 DSE 卷一 甲部（改編）"},{"id":"A-xiaoyao-2","tag":"論證手法","stem":"莊子講「不龜手之藥」的故事，主要說明：","options":["藥方本身價值不高","吳王善於用兵","宋人愚昧無知","同一事物，用之得法則大用，不得法則小用"],"answer":3,"explain":"同一藥方，有人只用於漂洗絲絮，有人用於水戰而得封侯，說明「所用之異」，關鍵在於善用。","src":"模擬題"},{"id":"A-xiaoyao-3","tag":"詞解","stem":"「今子有大樹，患其無用」中，「患」的意思是：","options":["疾病","厭惡","擔憂","禍患"],"answer":2,"explain":"「患」在此作動詞，解作擔憂、憂慮。","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-xiaoyao-4","tag":"論證手法","stem":"莊子以「狸狌」為喻的作用是：","options":["說明有所執著、自恃其能者反遭羅網，反襯「無用之用」","說明捕鼠的重要","讚美野貓身手敏捷","批評惠子貪得無厭"],"answer":0,"explain":"狸狌能捕鼠卻「中於機辟，死於罔罟」，與大樹「無所用」而終其天年形成對比，闡發無用之用的可貴。","src":"2021 DSE 卷一 甲部（改編）"},{"id":"A-xiaoyao-5","tag":"主旨","stem":"「無何有之鄉，廣莫之野」寄寓作者嚮往的境界是：","options":["歸隱田園、自給自足","博學多聞、周遊列國","建功立業、名垂青史","逍遙無為、擺脫世俗羈絆"],"answer":3,"explain":"把大樹置於虛寂無為之境，人可逍遙乎其下，體現莊子超越功利、無待而逍遙的理想。","src":"模擬題"},{"id":"A-xiaoyao-6","tag":"詞解","stem":"「夫子固拙於用大矣」中，「固」的意思是：","options":["堅固","實在、確實","固然","本來"],"answer":1,"explain":"「固」作副詞，解作實在、確實。莊子直斥惠子不善於用大，語氣肯定。","src":"模擬題"},{"id":"A-xiaoyao-7","tag":"內容理解","stem":"「剖之以為瓢，則瓠落無所容」中，「瓠落」形容：","options":["瓜熟蒂落","大而平淺的樣子","飄零落魄","空虛寂寞"],"answer":1,"explain":"「瓠落」狀大瓢平淺寬大之形，故無物可容，正是惠子眼中「大而無當」的寫照。","src":"模擬題"},{"id":"A-xiaoyao-8","tag":"詞解","stem":"「吾為其無用而掊之」中，「掊」的意思是：","options":["丟棄","種植","拾取","擊破、砸開"],"answer":3,"explain":"「掊」解作擊破。惠子因大瓠無用而擊破之，引出莊子「所用之異」的議論。","src":"模擬題"},{"id":"A-xiaoyao-9","tag":"內容理解","stem":"「宋人有善為不龜手之藥者」中，「龜」字：","options":["通「皸」，皮膚凍裂","龜甲","烏龜","堅硬"],"answer":0,"explain":"「龜」通「皸」，指皮膚受凍開裂。不龜手之藥即防凍瘡的藥膏。","src":"模擬題"},{"id":"A-xiaoyao-10","tag":"內容理解","stem":"「或不免於洴澼絖」中，「洴澼絖」指的是：","options":["縫製衣裳","織布染色","在水中漂洗絲絮","洗滌器具"],"answer":2,"explain":"「洴澼」為漂洗之聲，「絖」為絲絮。宋人世世以藥防手裂，只用於漂洗絲絮，見其用小不用大。","src":"模擬題"},{"id":"A-xiaoyao-11","tag":"內容理解","stem":"「何不慮以為大樽而浮乎江湖」中，「慮」的意思是：","options":["憂慮","思慮周詳","憂愁","考慮、設法"],"answer":3,"explain":"「慮」解作考慮、謀劃。莊子建議把大瓠繫在身上作腰舟浮游江湖，是「用大」的具體示範。","src":"模擬題"},{"id":"A-xiaoyao-12","tag":"論證手法","stem":"文中惠子與莊子的論辯，採用的主要形式是：","options":["直接說理，邏輯推演","寓言設喻，以具體故事層層反駁","對話辯難，不作比喻","引用經典，以古證今"],"answer":1,"explain":"全篇借大瓠、大樹等寓言設喻，以故事代說理，是《莊子》「寓言十九」的典型筆法。","src":"模擬題"},{"id":"A-xiaoyao-13","tag":"深層理解","stem":"「今夫斄牛，其大若垂天之雲。此能為大矣，而不能執鼠」的用意是：","options":["讚美斄牛高大","批評斄牛無用","說明物各有其用，大小之分不必拘執","比喻朝廷無人"],"answer":2,"explain":"斄牛大而不能捕鼠，正如大樹大而無所用；莊子藉此說明「大」自有其大用，不必以世俗小用衡量。","src":"模擬題"},{"id":"A-xiaoyao-14","tag":"內容理解","stem":"「彷徨乎無為其側，逍遙乎寢臥其下」寫的是：","options":["人在大樹下逍遙自得的生活圖景","作者徬徨無依的心境","大樹孤立的處境","惠子的困惑"],"answer":0,"explain":"「彷徨」在此為徜徉、遊息之意，非徬徨無依。兩句描繪逍遙臥息之樂，是全篇意境所在。","src":"模擬題"},{"id":"A-xiaoyao-15","tag":"內容理解","stem":"「不夭斤斧，物無害者」中，「夭」的意思是：","options":["逃夭","短暫","夭折、被摧折","夭夭茂盛"],"answer":2,"explain":"「夭」用作動詞，指被砍伐而夭折。大樹因無所用而不遭斧斤，反得全其天年。","src":"模擬題"},{"id":"A-xiaoyao-16","tag":"主旨","stem":"結句「無所可用，安所困苦哉」的含意是：","options":["無用不如有用","大樹終於被人利用","無用之物終究令人苦惱","正因無世俗之用，故無困苦禍患，得以逍遙"],"answer":3,"explain":"以反問作結，點明「無用之用」的主旨：不為世用反能全身遠禍，逍遙自得。","src":"模擬題"},{"id":"A-xiaoyao-17","tag":"論證手法","stem":"惠子與莊子對「大」的看法，最恰切的比較是：","options":["惠子讚美大，莊子貶抑大","惠子以世俗功利衡量，莊子主張超越功利的「用大」","兩者皆認為大無用","兩者皆主張大有用"],"answer":1,"explain":"惠子執於「有用」與「無用」的世俗標準，莊子則翻上一層，指出「無用」正是大用。","src":"模擬題"},{"id":"A-xiaoyao-18","tag":"寫作手法","stem":"《逍遙遊》運用寓言說理的效果是：","options":["使抽象哲理形象可感，富想像力與感染力","使文章篇幅縮短","使道理更為含蓄難明","使論證更為嚴密"],"answer":0,"explain":"以誇張的寓言形象承載哲理，想像奇詭而寓意深遠，是先秦諸子中最具文學性的說理方式。","src":"模擬題"},{"id":"A-xiaoyao-19","tag":"深層理解","stem":"「大樹」在文中的象徵意義是：","options":["世俗的功利標準","不為世用而能全其天年的理想人格","惠子的固執","自然界的偉大"],"answer":1,"explain":"大樹無所可用而免於斤斧，象徵超越功利、逍遙無待的理想人格，與作者自況相通。","src":"模擬題"},{"id":"A-xiaoyao-20","tag":"內容理解","stem":"「其大本擁腫而不中繩墨，其小枝卷曲而不中規矩」寫大樹：","options":["高大挺拔，可作棟樑","根部腐朽，將近枯萎","不合木工的繩墨規矩，故匠者不顧","枝葉繁茂，可供觀賞"],"answer":2,"explain":"「擁腫」謂疙疙疸疸，「卷曲」謂彎曲不直。正因不合繩墨規矩，匠人不屑一顧，大樹得以長存。","src":"模擬題"},{"id":"A-xiaoyao-21","tag":"詞解","stem":"「莊子謂惠子曰」一段中，「拙於用大」的「拙」意思是：","options":["不善於","謙稱自己的見解","笨拙","緩慢"],"answer":0,"explain":"「拙」解作不善於。莊子批評惠子不善於發揮「大」的作用，是全文論辯的關鍵判斷。","src":"模擬題"},{"id":"A-xiaoyao-22","tag":"主旨","stem":"綜合全篇，「逍遙」的境界最宜理解為：","options":["縱情山水，任意遊樂","無所事事，遊手好閒","功成身退，歸隱林下","無所待、無所役，擺脫功利束縛而自得"],"answer":3,"explain":"「逍遙」是無待於外、不為物役的精神自由，與世俗的「有用」標準相對，是莊子思想的核心。","src":"模擬題"}]},{"id":"A-quanxue","title":"勸學（節錄）","sub":"《荀子》· 論說","questions":[{"id":"A-quanxue-1","tag":"詞解","stem":"「君子博學而日參省乎己」中，「參」的意思是：","options":["參考","多次","參與","檢驗、檢查"],"answer":3,"explain":"「參省乎己」即檢查、省察自己；一說「參」通「三」，泛指多次。課文一般取檢驗、反省之義。","src":"模擬題"},{"id":"A-quanxue-2","tag":"文言基礎","stem":"「君子生非異也，善假於物也」中，「生」字：","options":["生長","出生","通「性」，指資質、天性","生命"],"answer":2,"explain":"「生」通「性」。句意：君子的資質並非與眾不同，只是善於借助外物（學習）罷了。","src":"模擬題"},{"id":"A-quanxue-3","tag":"論證手法","stem":"「青，取之於藍，而青於藍」主要運用了：","options":["比喻論證：說明學習可使人提升","對比論證：批評不學無術","引用論證：引述古籍","舉例論證：列舉染料之用"],"answer":0,"explain":"以靛青自藍草提煉而色更深為喻，形象說明學習能使人超越原有水平。","src":"模擬題"},{"id":"A-quanxue-4","tag":"主旨","stem":"「不積跬步，無以至千里；不積小流，無以成江海」強調學習貴在：","options":["堅持","善用外物","專心","積累"],"answer":3,"explain":"此句論學習須點滴積累；「鍥而不捨」講堅持、「用心一也」講專心，三者各有所指，須分辨。","src":"模擬題"},{"id":"A-quanxue-5","tag":"寫作手法","stem":"《勸學》大量運用比喻與排比，其表達效果主要是：","options":["使文章篇幅加長","使說理生動形象、氣勢充沛，增強說服力","使論點含蓄不外露","使語言晦澀難懂"],"answer":1,"explain":"一連串比喻、排比令抽象的學習道理具體可感，節奏鮮明、說服力強，是先秦論說文的典型風格。","src":"模擬題"},{"id":"A-quanxue-6","tag":"主旨","stem":"「學不可以已」一句在全文的作用是：","options":["承上啟下的過渡句","開門見山提出中心論點，統攝全篇","補充說明學習方法","總結上文的設喻"],"answer":1,"explain":"篇首即揭出「學不可以已」，其後論學習的意義、作用、方法與態度，皆由此生發。","src":"模擬題"},{"id":"A-quanxue-7","tag":"內容理解","stem":"「木直中繩，輮以為輪，其曲中規」中，「輮」的意思是：","options":["繩索","揉搓","車輪","用火烤使木材彎曲"],"answer":3,"explain":"「輮」通「煣」，指用火烘烤使木料彎曲。以木材經加工而改變形狀，比喻學習可改變人的本性。","src":"模擬題"},{"id":"A-quanxue-8","tag":"內容理解","stem":"「雖有槁暴，不復挺者」中，「槁暴」的意思是：","options":["曬乾、枯乾","暴風雨","乾枯而死","暴曬過度"],"answer":0,"explain":"「槁」枯，「暴」通「曝」，曬。木材雖經枯乾曝曬也不再挺直，比喻學習之效不可逆轉。","src":"模擬題"},{"id":"A-quanxue-9","tag":"論證手法","stem":"「故木受繩則直，金就礪則利」的比喻用意是：","options":["說明工具的重要","說明木工與冶金之術","說明人經學習與自省則可明理無過","說明天然材質的重要"],"answer":2,"explain":"木材經墨線校正如人受教，刀劍經磨礪如人受琢磨，由此導出「君子博學而日參省乎己，則知明而行無過矣」。","src":"模擬題"},{"id":"A-quanxue-10","tag":"內容理解","stem":"「吾嘗終日而思矣，不如須臾之所學也」強調：","options":["學習不如思考","思考須持之以恆","思考與學習並重","空想不如學習"],"answer":3,"explain":"「終日」與「須臾」對比，極言空想之無益與學習之速效，強調借助外物（學）的重要。","src":"模擬題"},{"id":"A-quanxue-11","tag":"寫作手法","stem":"「吾嘗跂而望矣，不如登高之博見也」運用的手法是：","options":["擬人：賦予高台以人情","比喻：以登高望遠喻借助學習開闊眼界","對比：跂望與登高之別","誇張：極言望遠之能"],"answer":1,"explain":"踮腳遠望不如登高所見之廣，比喻憑藉學習可突破自身局限，開啟視野。","src":"模擬題"},{"id":"A-quanxue-12","tag":"內容理解","stem":"「登高而招，臂非加長也，而見者遠」說明：","options":["登高者嗓音較大","招手須講技巧","借助外物可增強效果","手臂天生較長"],"answer":2,"explain":"臂未加長而見者遠，是因所立者高；類比學習：借助外在條件可事半功倍。","src":"模擬題"},{"id":"A-quanxue-13","tag":"詞解","stem":"「順風而呼，聲非加疾也，而聞者彰」中，「彰」的意思是：","options":["清楚","宏大","彰顯","表彰"],"answer":0,"explain":"「彰」解作清楚、明顯。聲音未增強而聽者清楚，是因順風，說明借助外物的功效。","src":"模擬題"},{"id":"A-quanxue-14","tag":"內容理解","stem":"「假輿馬者，非利足也，而致千里」中，「假」的意思是：","options":["假如","假裝","借助","借貸"],"answer":2,"explain":"「假」解作借助、利用。不善行走者借助車馬可至千里，比喻君子善假於物。","src":"模擬題"},{"id":"A-quanxue-15","tag":"內容理解","stem":"「假舟楫者，非能水也，而絕江河」中，「絕」的意思是：","options":["斷絕","極遠","超越","橫渡"],"answer":3,"explain":"「絕」解作橫渡。不會游泳者借助船槳可渡江河，與「假輿馬」同類，皆論借外物之效。","src":"模擬題"},{"id":"A-quanxue-16","tag":"主旨","stem":"「君子生非異也，善假於物也」的「物」具體指：","options":["朋友與師長","學習所得的知識與外在條件","自然萬物","財富與權勢"],"answer":1,"explain":"承上文「登高」「順風」「輿馬」「舟楫」諸喻，歸結於學習與借助外在條件的重要。","src":"模擬題"},{"id":"A-quanxue-17","tag":"論證手法","stem":"「積土成山，風雨興焉；積水成淵，蛟龍生焉」運用比喻論證，說明：","options":["積累可致質變，學習須日積月累","土與水的重要","山淵自然形成","風雨蛟龍由天而定"],"answer":0,"explain":"由積土積水而興風雨、生蛟龍，比喻積善成德而「神明自得，聖心備焉」。","src":"模擬題"},{"id":"A-quanxue-18","tag":"內容理解","stem":"「駑馬十駕，功在不舍」中，「舍」字：","options":["休息","通「捨」，放棄","房舍","居住"],"answer":1,"explain":"「舍」通「捨」。駑馬雖劣，十日之程亦能及，成功在於不放棄，強調學習貴在堅持。","src":"模擬題"},{"id":"A-quanxue-19","tag":"主旨","stem":"「鍥而舍之，朽木不折；鍥而不舍，金石可鏤」強調學習須：","options":["善用外物","循序渐进","持之以恆","專心致志"],"answer":2,"explain":"以朽木與金石對比，說明能否成功取決於是否堅持，與「駑馬十駕」同屬論學習態度。","src":"模擬題"},{"id":"A-quanxue-20","tag":"寫作手法","stem":"「蚓無爪牙之利，筋骨之強，上食埃土，下飲黃泉，用心一也」運用的是：","options":["對比：以蚯蚓之專一襯托學習須專心","比喻：以蚯蚓喻君子","擬人：蚯蚓有意志","排比：三句並列"],"answer":0,"explain":"蚯蚓無利爪強筋而能上食下飲，全憑用心專一；與蟹「用心躁也」形成對比，論學習貴專。","src":"模擬題"},{"id":"A-quanxue-21","tag":"內容理解","stem":"「蟹六跪而二螯，非蛇蟮之穴無可寄託者，用心躁也」說明蟹：","options":["行動敏捷","力大無窮","善於掘穴","雖有利器而無所寄託，因用心浮躁"],"answer":3,"explain":"蟹有六足二螯卻須寄居蛇蟮之穴，正反襯專一之重要，與蚯蚓形成鮮明對照。","src":"模擬題"},{"id":"A-quanxue-22","tag":"論證手法","stem":"本節以「蚓」與「蟹」並舉，其論證方法是：","options":["對比論證，正反相形","比喻論證，以物喻人","引用論證，引古為證","舉例論證，羅列事實"],"answer":0,"explain":"蚓用心一而成，蟹用心躁而無寄託，正反對比，歸結於學習須專心致志。","src":"模擬題"},{"id":"A-quanxue-23","tag":"主旨","stem":"綜合節錄三段，荀子論學習的重點依次是：","options":["學習的內容、時間與地點","學習的動機、目的與結果","學習的意義、作用與方法態度","學習的師資、教材與考核"],"answer":2,"explain":"首段論學習可改變本性（意義），次段論善假於物（作用），末段論積累、堅持與專心（方法態度）。","src":"模擬題"}]},{"id":"A-lianpo","title":"廉頗藺相如列傳（節錄）","sub":"司馬遷《史記》· 人物傳記","questions":[{"id":"A-lianpo-1","tag":"詞解","stem":"「大王見臣列觀，禮節甚倨」中，「倨」的意思是：","options":["周全","簡陋","傲慢","恭敬"],"answer":2,"explain":"「倨」解作傲慢。秦王在尋常宮觀接見相如，禮節簡慢，故相如得以據理力爭。","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-lianpo-2","tag":"文言基礎","stem":"「臣請完璧歸趙」中，「完」字的用法是：","options":["形容詞的使動用法，使……完整","名詞作狀語","通假字","形容詞作名詞"],"answer":0,"explain":"「完璧」即使璧完整無缺地歸還，屬使動用法，最能見相如的決心與機智。","src":"模擬題"},{"id":"A-lianpo-3","tag":"修辭","stem":"「怒髮上衝冠」運用的修辭手法是：","options":["比喻","對偶","借代","誇張"],"answer":3,"explain":"以頭髮豎起頂起帽子極言其怒，是誇張手法，生動刻畫相如面對強秦時的激憤與凜然。","src":"模擬題"},{"id":"A-lianpo-4","tag":"人物形象","stem":"「負荊請罪」一事主要表現廉頗：","options":["膽小怕事","勇於改過、以國事為重","不甘屈居人下","工於心計"],"answer":1,"explain":"身為上將而肉袒負荊登門謝罪，可見其坦率豪邁、知錯能改，且以將相和、國家安危為先。","src":"模擬題"},{"id":"A-lianpo-5","tag":"內容理解","stem":"澠池之會中相如迫秦王擊缶，主要表現他：","options":["善於音樂","機智勇敢、不畏強權，維護趙國尊嚴","貪圖一時之快","挑釁生事"],"answer":1,"explain":"以死相脅迫使秦王擊缶，是以「五步之內」的拚死之勇迫使對方讓步，外交上為趙國爭回體面。","src":"模擬題"},{"id":"A-lianpo-6","tag":"詞解","stem":"「使人遺趙王書」中，「遺」的意思是：","options":["遺失","遺留","給予賞賜","送交、致送"],"answer":3,"explain":"「遺」讀 wèi，解作送給、致送。秦王致書趙王願以十五城易璧。","src":"模擬題"},{"id":"A-lianpo-7","tag":"詞解","stem":"「欲予秦，秦城恐不可得，徒見欺」中，「徒」的意思是：","options":["白白地","步行","徒弟","徒然無功"],"answer":0,"explain":"「徒」解作白白地。趙國君臣進退兩難：給璧則恐受騙，不給則恐秦來攻。","src":"模擬題"},{"id":"A-lianpo-8","tag":"句式","stem":"「徒見欺」屬哪一種文言句式？","options":["省略句","判斷句","被動句（「見」字式）","疑問句"],"answer":2,"explain":"「見」置於動詞前表被動，即「白白地被欺騙」。同類如「見笑於大方之家」。","src":"模擬題"},{"id":"A-lianpo-9","tag":"內容理解","stem":"相如提出「寧許以負秦曲」，其策略是：","options":["拒絕秦國要求","請求齊國援助","拖延時間","先答應給璧，使秦負理虧之名"],"answer":3,"explain":"「負秦曲」即使秦承擔理虧的責任。相如先許秦而以曲直為據，是外交上的先發制人。","src":"模擬題"},{"id":"A-lianpo-10","tag":"詞解","stem":"「相如因持璧卻立」中，「卻」的意思是：","options":["拒絕","退後","但是","推卻"],"answer":1,"explain":"「卻」解作退。相如持璧退後倚柱而立，為「怒髮上衝冠」的威脅姿態作鋪墊。","src":"模擬題"},{"id":"A-lianpo-11","tag":"內容理解","stem":"相如持璧睨柱，欲以擊柱，其目的是：","options":["真的想毀璧","測試秦王反應","脅迫秦王，使其不敢強奪","表示絕望"],"answer":2,"explain":"以「璧碎人亡」的決絕姿態迫使秦王讓步，是相如智勇兼備的典型表現。","src":"模擬題"},{"id":"A-lianpo-12","tag":"詞解","stem":"「秦王恐其破璧，乃辭謝固請」中，「謝」的意思是：","options":["道歉","拒絕","感謝","辭別"],"answer":0,"explain":"「謝」解作道歉。秦王怕璧被毀而婉言道歉、堅請相如勿毀，可見相如之計奏效。","src":"模擬題"},{"id":"A-lianpo-13","tag":"內容理解","stem":"相如要求秦王「齋戒五日」並「設九賓於廷」，其目的是：","options":["試探秦王的誠意","顯示趙國的威儀","拖延時間，暗中派人將璧送回趙國","等待援軍到來"],"answer":2,"explain":"借隆重禮儀拖延時日，暗中遣從者「衣褐懷璧」歸趙，是「完璧歸趙」的關鍵部署。","src":"模擬題"},{"id":"A-lianpo-14","tag":"詞解","stem":"「相如度秦王特以詐佯為予趙城」中，「特」的意思是：","options":["特意","特地","特殊","只、不過"],"answer":3,"explain":"「特」作副詞，解作只不過。相如早已識破秦王以詐術假裝給城，故先遣璧歸趙。","src":"模擬題"},{"id":"A-lianpo-15","tag":"人物形象","stem":"相如歸璧後請就湯鑊，表現其：","options":["自恃功高","有膽有識、視死如歸，以理服人","魯莽衝動","悲觀厭世"],"answer":1,"explain":"既已完成使命，又以「臣知欺大王之罪當誅」坦承，令秦王無可奈何，機智與膽色兼備。","src":"模擬題"},{"id":"A-lianpo-16","tag":"內容理解","stem":"「相如既歸，趙王以為賢大夫，使不辱於諸侯」中，趙王拜相如為上大夫的原因是：","options":["出使秦國不辱使命","與廉頗交好","出身顯貴","善於辭令"],"answer":0,"explain":"「使不辱於諸侯」即出使而不被諸侯侮辱，是全篇對相如外交功績的總結評價。","src":"模擬題"},{"id":"A-lianpo-17","tag":"人物形象","stem":"藺相如「每朝時，常稱病，不欲與廉頗爭列」，反映他：","options":["身體虛弱","以國事為重，忍辱退讓","膽怯畏縮","藐視廉頗"],"answer":1,"explain":"不與廉頗爭位次，是「先國家之急而後私讎」，為後文「將相和」的轉折埋下伏筆。","src":"模擬題"},{"id":"A-lianpo-18","tag":"內容理解","stem":"相如解釋避讓廉頗時說「強秦之所以不敢加兵於趙者，徒以吾兩人在也」，其用意是：","options":["警告趙王","誇耀自己的功勞","說明將相和睦是國家安危所繫","批評廉頗無能"],"answer":2,"explain":"「徒以吾兩人在」點出二人同心則趙國安，故私怨不足計，是全文忠義精神的所在。","src":"模擬題"},{"id":"A-lianpo-19","tag":"詞解","stem":"「鄙賤之人，不知將軍寬之至此也」中，「寬」的意思是：","options":["寬容、寬待","寬廣","寬免","寬慰"],"answer":0,"explain":"廉頗自責為「鄙賤之人」，讚相如寬容，與前文傲慢態度形成對照，人物形象更顯立體。","src":"模擬題"},{"id":"A-lianpo-20","tag":"寫作手法","stem":"本傳刻畫人物形象，主要採用的手法是：","options":["以作者直接評論為主","以心理描寫為主","以環境烘托為主","以具體事件與人物語言行動展現性格"],"answer":3,"explain":"通過完璧歸趙、澠池之會、負荊請罪三件大事，配以對話行動，令人物性格躍然紙上。","src":"模擬題"},{"id":"A-lianpo-21","tag":"寫作手法","stem":"文中以秦王的傲慢與相如的從容作對照，其作用是：","options":["反襯相如的機智與膽識","說明外交的艱難","批評秦王無禮","交代秦國的強盛"],"answer":0,"explain":"強弱懸殊而相如處處佔上風，愈見其智勇，是《史記》「互見法」與對襯筆法的運用。","src":"模擬題"},{"id":"A-lianpo-22","tag":"主旨","stem":"「卒相與驩，為刎頸之交」一句的作用與含意是：","options":["預示趙國終將滅亡","說明二人成為好友","交代將相和好的結局，讚美二人以國事為重、生死與共的情誼","暗示二人將共赴戰場"],"answer":2,"explain":"「刎頸之交」即誓同生死的朋友。以團圓收束，凸顯先公後私的主題。","src":"模擬題"}]},{"id":"A-chushi","title":"出師表","sub":"諸葛亮 · 表（奏議）","questions":[{"id":"A-chushi-1","tag":"詞解","stem":"「陟罰臧否，不宜異同」中，「否」的意思是：","options":["惡、壞的","否則","閉塞","否定"],"answer":0,"explain":"「臧否」為對舉結構，臧＝善，否＝惡。「不宜異同」即不應有差別對待。","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-chushi-2","tag":"古今異義","stem":"「先帝不以臣卑鄙」中，「卑鄙」的古義是：","options":["行為不端","品格低下","出身貧寒","身份低微、見識淺陋"],"answer":3,"explain":"古義中性，只是自謙之詞；今義則帶強烈貶義。此為古今異義的常考例子，切忌以今律古。","src":"模擬題"},{"id":"A-chushi-3","tag":"體裁","stem":"下列何者最符合「表」此一文體的特點？","options":["朋友間往來的書信","臣下向君主陳情言事的奏議文，說理中帶濃厚感情","史官記事的史傳文","議論時政的論說文"],"answer":1,"explain":"「表」屬奏議一類，用於陳述衷情、提出建議；《出師表》尤以情理兼備、語重心長見稱。","src":"模擬題"},{"id":"A-chushi-4","tag":"內容理解","stem":"「親賢臣，遠小人」一語，主要是向後主提出哪方面的告誡？","options":["兵法之道","用人之道","理財之道","修身之道"],"answer":1,"explain":"並舉「親賢臣，遠小人，此先漢所以興隆也」，以歷史教訓勸後主慎於用人。","src":"模擬題"},{"id":"A-chushi-5","tag":"深層理解","stem":"篇末「臨表涕零」所流露的情感，不包括下列哪一項？","options":["對後主未能親賢遠佞的憂慮","感念先帝知遇之恩的深情","北定中原之志未酬的悲慨","對個人仕途不順的怨懟"],"answer":3,"explain":"「臨表涕零」含多重意涵：出師未捷之憂、後主昏庸之慮、先帝知遇之恩，絕非個人得失的怨懟。","src":"2026 DSE 卷一 甲部（考生回憶·改編）"},{"id":"A-chushi-6","tag":"詞解","stem":"「此誠危急存亡之秋也」中，「秋」的意思是：","options":["時候、時刻","年歲","季節","秋天"],"answer":0,"explain":"「秋」借指時機、關頭。全句謂這確實是危急存亡的時刻，語氣沉重。","src":"模擬題"},{"id":"A-chushi-7","tag":"詞解","stem":"「蓋追先帝之殊遇，欲報之於陛下也」中，「殊遇」的意思是：","options":["意外的相見","不同的遭遇","特別的恩遇","殊途同歸"],"answer":2,"explain":"「殊遇」即特殊的禮遇，指先帝三顧茅廬的知遇之恩，是諸葛亮畢生盡瘁的情感根源。","src":"模擬題"},{"id":"A-chushi-8","tag":"內容理解","stem":"「誠宜開張聖聽」是勸後主：","options":["開設講堂","凡事親自裁決","多聽音樂","廣開言路，聽取臣下意見"],"answer":3,"explain":"「開張聖聽」即擴大聖明的聽聞，與後文「不宜妄自菲薄，引喻失義」相承，屬納諫之勸。","src":"模擬題"},{"id":"A-chushi-9","tag":"內容理解","stem":"「不宜妄自菲薄，引喻失義，以塞忠諫之路也」旨在告誡後主：","options":["不要任用小人","不要輕視自己，說話失當，阻塞忠臣進諫之路","不要輕易出兵","不要妄自尊大"],"answer":1,"explain":"「妄自菲薄」與「引喻失義」皆指言語態度失當，會令忠臣不敢進言，與「開張聖聽」互為表裏。","src":"模擬題"},{"id":"A-chushi-10","tag":"內容理解","stem":"「宮中府中，俱為一體」的意思是：","options":["宮中事務由相府處理","宮中與府中互相監督","內廷與外廷應一視同仁，賞罰一致","皇宮與相府合併"],"answer":2,"explain":"強調內外一體、法度一致，故下文云「不宜偏私，使內外異法也」。","src":"模擬題"},{"id":"A-chushi-11","tag":"內容理解","stem":"諸葛亮推薦郭攸之、費禕、董允等人，其主要理由是：","options":["皆為忠良可靠、先帝簡拔之人","學問淵博","與自己有私交","戰功卓著"],"answer":0,"explain":"「此皆良實，志慮忠純，是以先帝簡拔以遺陛下」，以先帝選拔為據，最具說服力。","src":"模擬題"},{"id":"A-chushi-12","tag":"內容理解","stem":"「親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也」運用：","options":["引用論證","比喻論證","對比論證，以前後漢興衰為鑑","演繹推論"],"answer":2,"explain":"以兩漢興亡的歷史對比作證據，屬對比論證兼用典，勸誡之意極為深切。","src":"模擬題"},{"id":"A-chushi-13","tag":"詞解","stem":"「先帝不以臣卑鄙，猥自枉屈」中，「猥」的意思是：","options":["眾多","苟且","卑劣","謙詞，辱、降低身份"],"answer":3,"explain":"「猥」是自謙之詞，指對方降低身份。寫先帝三顧草廬，極見知遇之恩。","src":"模擬題"},{"id":"A-chushi-14","tag":"詞解","stem":"「遂許先帝以驅馳」中，「驅馳」的意思是：","options":["騎馬奔馳","奔走效勞","率軍出征","逃避戰亂"],"answer":1,"explain":"「驅馳」比喻為之奔走效力。許以驅馳即答應為先帝效勞，見其感恩圖報之心。","src":"模擬題"},{"id":"A-chushi-15","tag":"詞解","stem":"「後值傾覆，受任於敗軍之際，奉命於危難之間」中，「值」的意思是：","options":["遇到、碰上","輪到","抵擋","價值"],"answer":0,"explain":"「值」解作遇上。指建安十三年長阪之敗後奉命出使東吳之事。","src":"模擬題"},{"id":"A-chushi-16","tag":"內容理解","stem":"「故五月渡瀘，深入不毛」寫的是諸葛亮：","options":["討伐東吳","平定南中、安定後方","巡視邊境","征討曹魏"],"answer":1,"explain":"指建興三年南征孟獲之事。安定南方後方能專心北伐，故下文云「今南方已定，兵甲已足」。","src":"模擬題"},{"id":"A-chushi-17","tag":"內容理解","stem":"「此臣所以報先帝而忠陛下之職分也」中，「職分」指：","options":["朝廷的分工","軍中的職務","報答先帝、盡忠後主的責任本分","官職的等級"],"answer":2,"explain":"「職分」即本分。把北伐定位為報恩盡忠的本分，情理交融，是全文感情最濃處之一。","src":"模擬題"},{"id":"A-chushi-18","tag":"主旨","stem":"「鞠躬盡瘁，死而後已」的精神貫穿全篇，最能體現於：","options":["「願陛下託臣以討賊興復之效；不效，則治臣之罪」","「不宜妄自菲薄」","「親賢臣，遠小人」","「宮中府中，俱為一體」"],"answer":0,"explain":"以軍令狀式的承諾擔責，足見其一心為國、不計個人得失的忠誠。","src":"模擬題"},{"id":"A-chushi-19","tag":"寫作手法","stem":"《出師表》以「先帝」一詞反覆出現十三次，其作用是：","options":["填補篇幅","說明先帝的功績","炫耀與先帝的關係","以先帝之恩義為據，懇切動人，增強規勸的說服力"],"answer":3,"explain":"反覆稱述先帝，既是感恩，亦是借先帝權威勸誡後主，情感真摯而不卑不亢。","src":"模擬題"},{"id":"A-chushi-20","tag":"主旨","stem":"綜合全篇，諸葛亮上表的主要目的是：","options":["勸勉後主修明內政、親賢納諫，並表明北伐決心","請求增兵增餉","批評後主昏庸","請求辭官歸隱"],"answer":0,"explain":"前半以規勸內政為主，後半述己志與北伐部署，勸君與自陳並行，是「表」的典型寫法。","src":"模擬題"},{"id":"A-chushi-21","tag":"體裁","stem":"「今當遠離，臨表涕零，不知所言」最宜理解為：","options":["作者對出師感到徬徨","作者詞不達意","奏表的收結慣用語，兼見真情流露","作者悲傷過度而失語"],"answer":2,"explain":"「不知所言」為表文結語套語，然在此因情感真摯而格外動人，需結合全文體會。","src":"模擬題"}]},{"id":"A-shishuo","title":"師說","sub":"韓愈 · 論說","questions":[{"id":"A-shishuo-1","tag":"詞解","stem":"「人非生而知之者，孰能無惑」中，「孰」的意思是：","options":["甚麼","怎麼","豈","誰"],"answer":3,"explain":"「孰」作疑問代詞，解作「誰」。全句：人不是生下來就懂得道理的，誰能沒有疑惑呢？","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-shishuo-2","tag":"詞解","stem":"「師道之不傳也久矣」中，「師道」指的是：","options":["為師的技藝","從師學習的風尚","老師的道理","尊師的禮節"],"answer":1,"explain":"「師道」即從師問道的風尚。韓愈慨嘆此風久已不存，故作《師說》以贈李蟠。","src":"模擬題"},{"id":"A-shishuo-3","tag":"內容理解","stem":"「位卑則足羞，官盛則近諛」反映當時士大夫的心態是：","options":["注重門第出身","以從師為恥，計較地位高低","講求教學相長","重視師道尊嚴"],"answer":1,"explain":"以地位低者為師覺得羞恥，以官位高者為師又怕被指阿諛，正見士大夫恥於從師的荒謬心態。","src":"模擬題"},{"id":"A-shishuo-4","tag":"詞解","stem":"「是故無貴無賤，無長無少」中，「無」的意思是：","options":["不必","沒有","不要","無論"],"answer":3,"explain":"「無……無……」作條件連詞，解作「無論」。強調擇師只看「道」之所在。","src":"模擬題"},{"id":"A-shishuo-5","tag":"主旨","stem":"韓愈提出的擇師標準是：","options":["道之所存，師之所存","位高者為師","博學者為師","年長者為師"],"answer":0,"explain":"不分貴賤長少，誰掌握道理誰就可以為師，打破以年齡、地位取人的觀念。","src":"模擬題"},{"id":"A-shishuo-6","tag":"內容理解","stem":"「古之學者必有師。師者，所以傳道受業解惑也」中，「受」字：","options":["遭受","承受","通「授」，傳授","接受"],"answer":2,"explain":"「受」通「授」。開篇即為「師」下定義，是全篇立論的基礎。","src":"模擬題"},{"id":"A-shishuo-7","tag":"內容理解","stem":"「惑而不從師，其為惑也，終不解矣」的推論是：","options":["從師未必能解惑","疑惑會自然消失","解惑須靠自學","解惑必須從師"],"answer":3,"explain":"由「人非生而知之」到「必有師」，層層推論，確立從師的必要性。","src":"模擬題"},{"id":"A-shishuo-8","tag":"內容理解","stem":"「生乎吾前，其聞道也固先乎吾，吾從而師之」中的「師」字用法是：","options":["意動用法","名詞作動詞，以……為師","使動用法","一般名詞"],"answer":1,"explain":"「師之」即以之為師，名詞活用作動詞，帶有「以……為師」的意動意味。","src":"模擬題"},{"id":"A-shishuo-9","tag":"寫作手法","stem":"「吾師道也，夫庸知其年之先後生於吾乎」運用的句式是：","options":["感嘆，抒發感慨","疑問，表示不解","反問，強調從師不必計較年齡","設問，自問自答"],"answer":2,"explain":"「庸」解作豈、哪裏。以反問否定計較年長年幼的觀念，語氣堅決。","src":"模擬題"},{"id":"A-shishuo-10","tag":"內容理解","stem":"「古之聖人，其出人也遠矣，猶且從師而問焉」以聖人為例，其作用是：","options":["以聖人尚且從師，反襯今之眾人的愚昧","稱頌古代的教化","交代聖人的生平","說明聖人天生聰明"],"answer":0,"explain":"聖人「猶且從師」而眾人「恥學於師」，對比鮮明，是全文最主要的對比論證。","src":"模擬題"},{"id":"A-shishuo-11","tag":"論證手法","stem":"「今之眾人，其下聖人也亦遠矣，而恥學於師」與聖人對舉，運用的是：","options":["引用論證","比喻論證","對比論證，古今、聖愚相對","類比論證"],"answer":2,"explain":"聖益聖、愚益愚的對比，突出「恥師」之弊，為批判時俗蓄勢。","src":"模擬題"},{"id":"A-shishuo-12","tag":"內容理解","stem":"「愛其子，擇師而教之；於其身也，則恥師焉，惑矣」指出士大夫：","options":["自身學問已足","不信任教師","愛子深切","對子與對己標準不一，自相矛盾"],"answer":3,"explain":"「小學而大遺」的批評由此而來：教子是小事而從師是大事，捨大取小，故曰「惑矣」。","src":"模擬題"},{"id":"A-shishuo-13","tag":"內容理解","stem":"「句讀之不知，惑之不解，或師焉，或不焉」中，「不」字：","options":["不願","通「否」","不曾","不能"],"answer":1,"explain":"「不」通「否」。句意：不知句讀則從師，有疑惑卻不從師，正是「小學而大遺」。","src":"模擬題"},{"id":"A-shishuo-14","tag":"內容理解","stem":"「巫醫樂師百工之人，不恥相師」與士大夫「群聚而笑之」對舉，其用意是：","options":["以百工之不恥相師，反襯士大夫智反不及","讚美工匠的技藝","批評工匠不知禮數","說明各行各業皆需學習"],"answer":0,"explain":"末句「其可怪也歟」正為此發：身份低下者反知從師，士大夫卻恥之，諷刺極為尖銳。","src":"模擬題"},{"id":"A-shishuo-15","tag":"論證手法","stem":"「孔子曰：三人行，則必有我師」運用的是：","options":["舉例論證","引用論證，引聖人之言為證","比喻論證","對比論證"],"answer":1,"explain":"引孔子語為據，再以「弟子不必不如師，師不必賢於弟子」申論，權威性與說服力俱增。","src":"模擬題"},{"id":"A-shishuo-16","tag":"內容理解","stem":"「是故弟子不必不如師，師不必賢於弟子」的原因是：","options":["教師學識有限","時代不斷進步","聞道有先後，術業有專攻","弟子天資較高"],"answer":2,"explain":"以「聞道有先後，術業有專攻」解釋師生互有長短，為「不恥相師」提供理論根據。","src":"模擬題"},{"id":"A-shishuo-17","tag":"內容理解","stem":"韓愈作《師說》贈李蟠，其直接原因是李蟠：","options":["不拘於時，學於余（能從師而學）","請韓愈為其著作作序","考中進士","出任官職"],"answer":0,"explain":"末段「余嘉其能行古道，作《師說》以貽之」，點明贈文緣由，亦為全篇作結。","src":"模擬題"},{"id":"A-shishuo-18","tag":"寫作手法","stem":"「孔子師郯子、萇弘、師襄、老聃」一句的論證作用是：","options":["批評當時學者","交代孔子生平","說明孔子的師承","以聖人多師的事例佐證「聖人無常師」"],"answer":3,"explain":"連舉四位老師，實例佐證「聖人無常師」，與上文引用相呼應，論據層層加厚。","src":"模擬題"},{"id":"A-shishuo-19","tag":"主旨","stem":"《師說》的中心論點是：","options":["學必從師，道之所存即師之所存","教師地位應當提高","古代師道已不可復","為師者須博學"],"answer":0,"explain":"篇首「古之學者必有師」揭出論點，全篇反覆論證從師的必要與擇師的標準。","src":"模擬題"},{"id":"A-shishuo-20","tag":"寫作手法","stem":"本文多用對比與反問，其整體風格是：","options":["華麗鋪陳，辭采斐然","含蓄委婉，意在言外","議論犀利，氣勢充沛，富有戰鬥性","平實質樸，不尚修飾"],"answer":2,"explain":"韓愈提倡古文運動，反對駢儷，行文以氣勢取勝，多用對比、反問、排比，極具論辯力。","src":"模擬題"}]},{"id":"A-xishan","title":"始得西山宴遊記","sub":"柳宗元 · 遊記","questions":[{"id":"A-xishan-1","tag":"文言基礎","stem":"「自余為僇人，居是州，恆惴慄」中，「僇」字：","options":["羞辱他人","通「戮」，指受刑辱的罪人","勞苦","殺戮"],"answer":1,"explain":"「僇」通「戮」，貶謫之人自稱罪人，可見作者被貶永州後的驚懼不安。","src":"模擬題"},{"id":"A-xishan-2","tag":"詞解","stem":"「不與培塿為類」中，「培塿」指的是：","options":["草木","小土丘","山坡","城牆"],"answer":1,"explain":"「培塿」即小土丘。以小土丘襯托西山「特出」，暗喻作者不屑與凡俗為伍的孤高。","src":"模擬題"},{"id":"A-xishan-3","tag":"寫作手法","stem":"「凡數州之土壤，皆在衽席之下」描寫西山，運用的是：","options":["象徵：以山喻人","對比：與他山比較","正面描寫：直接寫山石之奇","側面烘托：以所見之廣顯西山之高"],"answer":3,"explain":"不直接寫山高，而寫登臨所見之遠，是側面烘托，亦為後文「始得」的震撼作鋪墊。","src":"模擬題"},{"id":"A-xishan-4","tag":"深層理解","stem":"「心凝形釋，與萬化冥合」表現作者登西山後的心境是：","options":["物我兩忘、與天地融合","孤獨淒涼","驚懼不安","壯志未酬"],"answer":0,"explain":"由「恆惴慄」到「與萬化冥合」，是全文情感轉折的關鍵，寫出貶謫之苦在大自然中得到消解。","src":"模擬題"},{"id":"A-xishan-5","tag":"主旨","stem":"題中「始得」二字最宜理解為：","options":["開始喜歡遊山玩水","第一次登上西山","初次真正領略西山之奇，亦含此前虛度之意","終於找到西山"],"answer":2,"explain":"「始得」含雙重意味：此前遊眾山而未得真趣，至此方初次領會；亦暗寓精神上的真正解脫。","src":"模擬題"},{"id":"A-xishan-6","tag":"詞解","stem":"「到則披草而坐，傾壺而醉」中，「披」的意思是：","options":["披上","傾倒","覆蓋","撥開、分開"],"answer":3,"explain":"「披草」即撥開草叢。寫平日遊山的隨意，與登西山後的莊重形成對比。","src":"模擬題"},{"id":"A-xishan-7","tag":"內容理解","stem":"「醉則更相枕以臥，臥而夢……覺而起，起而歸」連用頂真，其效果是：","options":["使文句簡潔","寫出醉臥夢起的循環往復，見遊山之頻而無所得","交代時間順序","描寫山中景色"],"answer":1,"explain":"頂真句式令節奏急促，凸顯「以為凡是州之山水有異態者，皆我有也」的盲目自滿。","src":"模擬題"},{"id":"A-xishan-8","tag":"內容理解","stem":"「以為凡是州之山水有異態者，皆我有也，而未始知西山之怪特」的作用是：","options":["交代遊覽的收穫","總結上文遊歷","以先前的自滿反襯後文西山之震撼，為「始得」蓄勢","說明永州山水之美"],"answer":2,"explain":"「而未始知」一轉，由自滿到驚覺，是全文結構上最重要的轉折。","src":"模擬題"},{"id":"A-xishan-9","tag":"詞解","stem":"「遂命僕人過湘江，緣染溪，斫榛莽，焚茅茷」中，「緣」的意思是：","options":["沿著","攀緣","緣分","因為"],"answer":0,"explain":"「緣」解作沿著。「過、緣、斫、焚」一連串動詞，寫出攀登的艱辛與決心。","src":"模擬題"},{"id":"A-xishan-10","tag":"內容理解","stem":"「窮山之高而止」中，「窮」的意思是：","options":["貧窮","困窘","窮盡、走到盡頭","搜尋"],"answer":2,"explain":"「窮」作動詞，解作窮盡。攀至山頂方止，見作者尋幽探勝的執著。","src":"模擬題"},{"id":"A-xishan-11","tag":"詞解","stem":"「攀援而登，箕踞而遨」中，「箕踞」的意思是：","options":["倚樹而立","恭敬端坐","盤腿打坐","張開雙腿席地而坐，狀其舒放自由"],"answer":3,"explain":"「箕踞」本為不拘禮節之坐姿，在此寫登頂後無拘無束、盡情觀覽的暢快。","src":"模擬題"},{"id":"A-xishan-12","tag":"寫作手法","stem":"「則凡數州之土壤，皆在衽席之下」一句中，「衽席」借指：","options":["床鋪","坐席，代指作者所處之地","宴席","衣裳"],"answer":1,"explain":"「衽席」借代坐臥之處，極言視野開闊，數州土地盡收眼底。","src":"模擬題"},{"id":"A-xishan-13","tag":"寫作手法","stem":"「其高下之勢，岈然洼然，若垤若穴」運用比喻寫地貌，其效果是：","options":["以蟻垤洞穴喻高低起伏，形象襯出西山之高峻","說明山中多洞穴","交代山路的難行","描寫地勢平坦"],"answer":0,"explain":"以小蟻塚、洞穴比喻山下地貌，居高臨下而眾山如蟻垤，襯托之妙正在於此。","src":"模擬題"},{"id":"A-xishan-14","tag":"內容理解","stem":"「尺寸千里，攢蹙累積，莫得遯隱」寫的是：","options":["地圖的比例","千里景物收於尺寸之間，盡在眼前無所遁形","測量的方法","山勢狹小"],"answer":1,"explain":"「尺寸千里」極言視野之廣而景物之密，是寫登高所見的名句。","src":"模擬題"},{"id":"A-xishan-15","tag":"內容理解","stem":"「縈青繚白，外與天際，四望如一」中的「青」與「白」分別指：","options":["青松與白石","青草與白霜","青山與白雲（白水）","青天與白雲"],"answer":2,"explain":"「青」指山色，「白」指雲氣或水色。青山白雲繚繞，與天相接，寫視野之極遠。","src":"模擬題"},{"id":"A-xishan-16","tag":"主旨","stem":"「然後知是山之特立，不與培塿為類」的言外之意是：","options":["以西山之特立自況，寄寓孤高不群的品格","說明地貌的差異","讚美西山的地勢","感慨自然之奇"],"answer":0,"explain":"西山特立不群，正如作者不屑與世俗同流，是典型的托物言志。","src":"模擬題"},{"id":"A-xishan-17","tag":"內容理解","stem":"「悠悠乎與灝氣俱，而莫得其涯；洋洋乎與造物者遊，而不知其所窮」寫作者：","options":["感嘆人生短暫","對未來感到茫然","在山中迷路","與天地之氣相融，遊於造物者之境而不知所終"],"answer":3,"explain":"「悠悠」「洋洋」寫與自然冥合的暢達，與開篇「恆惴慄」遙遙相對。","src":"模擬題"},{"id":"A-xishan-18","tag":"詞解","stem":"「引觴滿酌，頹然就醉」中，「頹然」的意思是：","options":["醉倒的樣子","失望的樣子","精神萎靡","衰敗的樣子"],"answer":0,"explain":"「頹然」狀醉倒之態。此醉與前文「傾壺而醉」不同，是心滿意足之醉。","src":"模擬題"},{"id":"A-xishan-19","tag":"內容理解","stem":"「日之入，蒼然暮色，自遠而至，至無所見，而猶不欲歸」寫作者：","options":["天黑不敢下山","迷失歸途","沉醉山景而流連忘返","等待友人"],"answer":2,"explain":"由「至無所見」而「猶不欲歸」，極言其陶醉之深，為「心凝形釋」作鋪墊。","src":"模擬題"},{"id":"A-xishan-20","tag":"主旨","stem":"結句「然後知吾嚮之未始遊，遊於是乎始」的含意是：","options":["今後不再遊山","開始喜歡旅遊","西山是最後一站","此前之遊皆非真遊，真正的遊歷自西山始"],"answer":3,"explain":"「嚮」通「向」，從前。以否定從前之遊來肯定此次，呼應題目「始得」，收束有力。","src":"模擬題"},{"id":"A-xishan-21","tag":"寫作手法","stem":"全文以「未始知」與「然後知」前後呼應，其結構作用是：","options":["補充說明","欲揚先抑，以先前的平庸反襯西山之奇，突出「始得」之意","交代寫作時間","對比永州與西山"],"answer":1,"explain":"先寫遍遊而無所得，再寫登西山而悟，抑揚之間主題自見，是本文結構的精妙處。","src":"模擬題"}]},{"id":"A-yueyang","title":"岳陽樓記","sub":"范仲淹 · 記（借景抒情）","questions":[{"id":"A-yueyang-1","tag":"詞解","stem":"「滕子京謫守巴陵郡」中，「謫」的意思是：","options":["告老","貶官","調任","升遷"],"answer":1,"explain":"「謫」特指官吏因罪被降職或外放。滕子京被貶而能「政通人和，百廢具興」，正是范文立論的引子。","src":"模擬題"},{"id":"A-yueyang-2","tag":"詞解","stem":"「至若春和景明，波瀾不驚」中，「景」的意思是：","options":["景象","景色","風景","日光"],"answer":3,"explain":"「景」古義為日光。此為古今異義常考字，切勿逕解作「風景」。","src":"模擬題"},{"id":"A-yueyang-3","tag":"句式","stem":"「微斯人，吾誰與歸」屬哪一種文言特殊句式？","options":["疑問代詞作賓語，賓語前置","定語後置","判斷句","被動句"],"answer":0,"explain":"正常語序為「吾與誰歸」，疑問代詞「誰」作介詞「與」的賓語而前置。","src":"模擬題"},{"id":"A-yueyang-4","tag":"主旨","stem":"「先天下之憂而憂，後天下之樂而樂」表現古仁人：","options":["寄情山水的閒適","因貶謫而消極避世","以天下為己任的胸懷與抱負","追求個人名利"],"answer":2,"explain":"這是全文點睛之筆，把個人榮辱置於天下之後，與遷客騷人「以物喜，以己悲」形成對照。","src":"模擬題"},{"id":"A-yueyang-5","tag":"寫作手法","stem":"第三、四段分別寫霪雨霏霏與春和景明，其作用是：","options":["交代岳陽樓的地理位置","展示作者寫景的功力","說明氣候變化無常","以兩種景物引出兩種心情，為下文「不以物喜，不以己悲」作對比鋪墊"],"answer":3,"explain":"先極寫悲景悲情、樂景樂情，再以「予嘗求古仁人之心」一轉，襯出更高境界。","src":"模擬題"},{"id":"A-yueyang-6","tag":"詞解","stem":"「越明年，政通人和，百廢具興」中，「具」字：","options":["詳細","通「俱」，都","具備","器具"],"answer":1,"explain":"「具」通「俱」。寫滕子京貶謫後仍勤於政事，為「重修岳陽樓」提供背景。","src":"模擬題"},{"id":"A-yueyang-7","tag":"詞解","stem":"「乃重修岳陽樓，增其舊制」中，「制」的意思是：","options":["製作","節制","規模、形制","制度"],"answer":2,"explain":"「舊制」即原有的規模。增其舊制即擴大原有規模，屬記體文交代修建因由的常筆。","src":"模擬題"},{"id":"A-yueyang-8","tag":"內容理解","stem":"「屬予作文以記之」中，「屬」字：","options":["通「囑」，囑託","屬於","屬下","歸屬"],"answer":0,"explain":"「屬」通「囑」。滕子京囑託作者作記，交代寫作緣起。","src":"模擬題"},{"id":"A-yueyang-9","tag":"內容理解","stem":"「予觀夫巴陵勝狀，在洞庭一湖」在結構上的作用是：","options":["過渡到議論","總結全文","由敘事轉入寫景，總領下文景物描寫","補充說明"],"answer":2,"explain":"「觀夫」二字領起，以下寫洞庭湖的雄偉氣象，再由景入情，層次分明。","src":"模擬題"},{"id":"A-yueyang-10","tag":"寫作手法","stem":"「銜遠山，吞長江，浩浩湯湯，橫無際涯」運用擬人與誇張，其效果是：","options":["說明洞庭湖的地理位置","描寫江湖交匯之險","暗示水患之憂","極寫洞庭湖氣勢雄渾，氣象萬千"],"answer":3,"explain":"「銜」「吞」二字賦予湖水以氣魄，空間上極為開闊，為下文「遷客騷人」的覽物之情作勢。","src":"模擬題"},{"id":"A-yueyang-11","tag":"詞解","stem":"「朝暉夕陰，氣象萬千」中，「暉」的意思是：","options":["光輝","日光","早晨","明亮"],"answer":1,"explain":"「暉」指陽光。朝夕陰晴變化無窮，故曰「氣象萬千」。","src":"模擬題"},{"id":"A-yueyang-12","tag":"內容理解","stem":"「遷客騷人，多會於此，覽物之情，得無異乎」一句的句式與作用是：","options":["反問句，引出下文兩種覽物之情的對比","疑問句，表示不解","感嘆句，抒發感慨","設問句，自問自答"],"answer":0,"explain":"「得無……乎」表推測反問，意為「怎能不有所不同呢」，自然過渡到三、四段。","src":"模擬題"},{"id":"A-yueyang-13","tag":"內容理解","stem":"「若夫霪雨霏霏，連月不開」一段所引發的情感是：","options":["悠然自得，逍遙物外","去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲","心曠神怡，寵辱偕忘","豪情壯志，意氣風發"],"answer":1,"explain":"陰風濁浪、日星隱曜，景物淒涼，遷客騷人因而悲從中來。","src":"模擬題"},{"id":"A-yueyang-14","tag":"詞解","stem":"「薄暮冥冥，虎嘯猿啼」中，「薄」的意思是：","options":["稀薄","輕微","迫近","淡薄"],"answer":2,"explain":"「薄暮」即傍晚，日將落而迫近於暮。與「日薄西山」之「薄」同義。","src":"模擬題"},{"id":"A-yueyang-15","tag":"內容理解","stem":"「至若春和景明，波瀾不驚」一段所引發的情感是：","options":["心曠神怡，寵辱偕忘，把酒臨風，其喜洋洋","感慨身世，鬱鬱不樂","悲從中來，感極而悲","思鄉念遠，惆悵不已"],"answer":0,"explain":"春光明媚、鷗翔魚游、皓月千里，景物明麗，故覽物者喜氣洋洋。","src":"模擬題"},{"id":"A-yueyang-16","tag":"詞解","stem":"「沙鷗翔集，錦鱗游泳」中，「集」的意思是：","options":["集合","聚集","飛翔","停息、棲止"],"answer":3,"explain":"「翔集」為飛翔與棲止。寫沙鷗時飛時歇，與「錦鱗游泳」一動一靜相映。","src":"模擬題"},{"id":"A-yueyang-17","tag":"修辭","stem":"「浮光躍金，靜影沉璧」運用比喻，分別寫：","options":["月照湖面之金光與月影如沉璧","波光與月色","金子與玉器","日光與雲影"],"answer":0,"explain":"「躍金」喻月光浮動，「沉璧」喻月影圓潤如玉，是寫月夜湖景的名句。","src":"模擬題"},{"id":"A-yueyang-18","tag":"內容理解","stem":"「予嘗求古仁人之心，或異二者之為」中的「二者」指：","options":["古人與今人","滕子京與作者","上文因陰晴景物而悲、而喜的兩種心情","遷客與騷人"],"answer":2,"explain":"「二者」即第三段之悲與第四段之喜，古仁人「不以物喜，不以己悲」，故異於二者。","src":"模擬題"},{"id":"A-yueyang-19","tag":"內容理解","stem":"「居廟堂之高則憂其民；處江湖之遠則憂其君」說明古仁人：","options":["在位時憂民，在野時憂君","進亦憂退亦憂，故無所適從","在野時不問政事","進退皆憂，不論在位在野皆心繫天下"],"answer":3,"explain":"進亦憂退亦憂，故「先天下之憂而憂」，是全篇由抒情轉入議論的關鍵句。","src":"模擬題"},{"id":"A-yueyang-20","tag":"詞解","stem":"「微斯人，吾誰與歸」中，「微」的意思是：","options":["稍微","如果沒有","隱微","微小"],"answer":1,"explain":"「微」解作若非、如果沒有。句意：若無這樣的人，我與誰同道呢？","src":"模擬題"},{"id":"A-yueyang-21","tag":"體裁","stem":"《岳陽樓記》屬於「記」體，其特點是：","options":["以記物為名，借題發揮，兼敘事、寫景、抒情、議論","專記建築的形制","記人物的生平","純為遊覽的遊記"],"answer":0,"explain":"本文名為記樓，實則寫景抒情而歸於議論，是宋代「記」體變格的代表。","src":"模擬題"},{"id":"A-yueyang-22","tag":"主旨","stem":"綜合全篇，作者寫作《岳陽樓記》的用意是：","options":["描寫洞庭湖的景色","借記樓規勸滕子京並自勵，表達先憂後樂的抱負","抒發貶謫的悲憤","記述岳陽樓的修建經過"],"answer":1,"explain":"結句「微斯人，吾誰與歸」兼含勉友與自勉之意，全文歸宿在於士人的責任。","src":"模擬題"}]},{"id":"A-liuguo","title":"六國論","sub":"蘇洵 · 史論","questions":[{"id":"A-liuguo-1","tag":"詞解","stem":"「六國破滅……弊在賂秦」中，「弊」的意思是：","options":["破敗","疲困","欺騙","弊病、毛病"],"answer":3,"explain":"「弊」解作弊病、害處。開篇即斷言「弊在賂秦」，是全文的中心論點。","src":"模擬題"},{"id":"A-liuguo-2","tag":"詞解","stem":"「諸侯之所大患，固不在戰矣」中，「固」的意思是：","options":["本來","堅固","固然","堅持"],"answer":0,"explain":"答案為「本來」。常見誤答「固然」，但「固然」表讓步，與句意「根本不在於打仗」不合。","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-liuguo-3","tag":"論證手法","stem":"「以地事秦，猶抱薪救火，薪不盡，火不滅」運用比喻論證，說明：","options":["秦國終會被六國所滅","秦國慾壑難填但六國尚可自保","割地求和只會助長秦國野心，終至滅亡","救火須及時"],"answer":2,"explain":"柴不盡火不滅，比喻土地不盡則秦之侵略不止，形象說明賂秦之害。","src":"2020 DSE 卷一 甲部（改編）"},{"id":"A-liuguo-4","tag":"古今異義","stem":"「下而從六國破亡之故事」中，「故事」的古義是：","options":["虛構的情節","過去的事蹟","歷史小說","舊例、前例"],"answer":3,"explain":"古義指舊日的成例。句意：以泱泱大國之勢，卻重蹈六國滅亡的覆轍。","src":"模擬題"},{"id":"A-liuguo-5","tag":"主旨","stem":"《六國論》的中心論點是：","options":["六國破滅，天意使然","六國破滅，弊在賂秦","六國破滅，戰略不善","六國破滅，兵器不利"],"answer":1,"explain":"首句即提出「弊在賂秦」，再分「賂秦而力虧」與「不賂者以賂者喪」兩端論證。","src":"模擬題"},{"id":"A-liuguo-6","tag":"論證手法","stem":"「賂秦而力虧，破滅之道也」與「不賂者以賂者喪」在結構上的關係是：","options":["並列兩種無關的原因","層層遞進，由淺入深","分論兩類國家，從正反兩面支撐中心論點","先總後分，再作總結"],"answer":2,"explain":"先論直接賂秦的韓魏楚，再論齊燕趙因失援而亡，兩端合證「弊在賂秦」。","src":"模擬題"},{"id":"A-liuguo-7","tag":"內容理解","stem":"「秦以攻取之外，小則獲邑，大則得城」寫秦國：","options":["除戰爭外還靠諸侯賄賂而擴張領土","攻取所得多於受賄所得","受賄所得微不足道","只靠武力攻取"],"answer":0,"explain":"較秦之所得與戰勝而得者「其實百倍」，極言賄賂之害甚於戰敗。","src":"模擬題"},{"id":"A-liuguo-8","tag":"內容理解","stem":"「諸侯之所亡，與戰敗而亡者，其實亦百倍」意在說明：","options":["戰敗損失慘重","諸侯屢戰屢敗","賂秦所失遠多於戰敗所失","秦國戰力強大"],"answer":2,"explain":"以數字對比凸顯賂秦之愚，是論據中最有力的一組數據。","src":"模擬題"},{"id":"A-liuguo-9","tag":"詞解","stem":"「思厥先祖父，暴霜露，斬荊棘，以有尺寸之地」中，「厥」的意思是：","options":["於是","乃","昏厥","其，他們的"],"answer":3,"explain":"「厥」作代詞，解作他們的。寫先祖創業之艱，與子孫「舉以予人」形成強烈對比。","src":"模擬題"},{"id":"A-liuguo-10","tag":"詞解","stem":"「暴霜露，斬荊棘」中，「暴」字：","options":["突然","通「曝」，暴露於","暴烈","殘暴"],"answer":1,"explain":"「暴」通「曝」，讀 pù，解作暴露。寫先祖櫛風沐雨開闢疆土的艱辛。","src":"模擬題"},{"id":"A-liuguo-11","tag":"寫作手法","stem":"「子孫視之不甚惜，舉以予人，如棄草芥」運用比喻與對比，其效果是：","options":["以草芥喻國土，譏刺子孫輕棄祖業的愚昧","描寫戰亂慘狀","說明土地貧瘠","讚美先祖的節儉"],"answer":0,"explain":"創業之難與棄地之易對比鮮明，為「賂秦」之非作情感上的譴責。","src":"模擬題"},{"id":"A-liuguo-12","tag":"詞解","stem":"「今日割五城，明日割十城，然後得一夕安寢」中，「然後」的意思是：","options":["接著就","這樣以後","既然如此","然而"],"answer":1,"explain":"「然後」為「然」＋「後」，解作這樣以後。割地換來的只是短暫安眠，諷刺極深。","src":"模擬題"},{"id":"A-liuguo-13","tag":"內容理解","stem":"「起視四境，而秦兵又至矣」寫出割地求和的結果是：","options":["令秦國退兵","使邊境安定","苟安一時而秦患無窮","換來長久和平"],"answer":2,"explain":"與「一夕安寢」呼應，寫出「抱薪救火」的具體後果，論證極具畫面感。","src":"模擬題"},{"id":"A-liuguo-14","tag":"論證手法","stem":"「諸侯之地有限，暴秦之欲無厭，奉之彌繁，侵之愈急」運用：","options":["對比論證：有限與無厭相對，說明賂秦必亡","引用論證","比喻論證","舉例論證"],"answer":0,"explain":"「有限」與「無厭」對舉，道盡割地求和的死結，故曰「不戰而強弱勝負已判矣」。","src":"模擬題"},{"id":"A-liuguo-15","tag":"內容理解","stem":"「至於顛覆，理固宜然」中的「理」指：","options":["處事條理","天理循環","物理規律","割地求和必然自取滅亡的道理"],"answer":3,"explain":"承接上文對比，斷言賂秦者之亡理所當然，語氣斬釘截鐵。","src":"模擬題"},{"id":"A-liuguo-16","tag":"內容理解","stem":"「齊人未嘗賂秦，終繼五國遷滅，何哉？」其答案是：","options":["與嬴而不助五國，五國既喪，齊亦不免","齊國兵力不足","齊國君主昏庸","齊國外交失策"],"answer":0,"explain":"「與嬴」即親附秦國。齊不助五國，終於孤立而亡，印證「不賂者以賂者喪」。","src":"模擬題"},{"id":"A-liuguo-17","tag":"內容理解","stem":"「燕趙之君，始有遠略，能守其土，義不賂秦」中，「義」的用法是：","options":["名詞作動詞","形容詞","名詞作狀語，按道義","道義（名詞）"],"answer":2,"explain":"「義不賂秦」即按道義不肯賂秦。燕趙初期堅守，故「斯用兵之效也」。","src":"模擬題"},{"id":"A-liuguo-18","tag":"內容理解","stem":"「至丹以荊卿為計，始速禍焉」中，「速」的意思是：","options":["催促","迅速","加速","招致"],"answer":3,"explain":"「速」作動詞，解作招致。燕太子丹遣荊軻刺秦，反招致速亡之禍。","src":"模擬題"},{"id":"A-liuguo-19","tag":"詞解","stem":"「洎牧以讒誅，邯鄲為郡」中，「洎」的意思是：","options":["自從","等到","及時","因為"],"answer":1,"explain":"「洎」讀 jì，解作及至、等到。李牧被殺，趙國遂亡而邯鄲成為秦之一郡。","src":"模擬題"},{"id":"A-liuguo-20","tag":"主旨","stem":"「苟以天下之大，下而從六國破亡之故事，是又在六國下矣」的用意是：","options":["借六國之鑑諷諫宋朝，警惕勿以賂求和","總結六國滅亡的原因","批評六國無能","讚美宋朝國力強盛"],"answer":0,"explain":"「天下之大」指北宋。借古諷今是《六國論》的現實關懷所在，也是全文的真正落腳點。","src":"模擬題"},{"id":"A-liuguo-21","tag":"寫作手法","stem":"「嗚呼」「悲夫」等感嘆詞與設問句在文中的作用是：","options":["純屬修辭裝飾","增強議論的感情色彩與氣勢，使說理更具感染力","表示作者猶豫","填補篇幅"],"answer":1,"explain":"史論而帶感情，是蘇洵散文的特色；感嘆與設問交替，令論證氣勢磅礡。","src":"模擬題"}]},{"id":"A-shanju","title":"唐詩三首 · 山居秋暝","sub":"王維 · 五言律詩","questions":[{"id":"A-shanju-1","tag":"內容理解","stem":"「空山新雨後，天氣晚來秋」中，「空山」宜理解為：","options":["幽靜空曠的山林","空無一物的山","虛無縹緲的仙境","荒蕪無人的禿山"],"answer":0,"explain":"「空」重在幽靜、空靈，非指絕無人煙——下文明有浣女漁舟。答題時須扣「空靈幽靜」的意境。","src":"模擬題"},{"id":"A-shanju-2","tag":"寫作手法","stem":"「明月松間照，清泉石上流」主要運用了：","options":["象徵","對比","動靜結合、以動襯靜","誇張"],"answer":2,"explain":"月照為靜，泉流為動，以清泉流動之聲反襯山林之幽靜，是王維「以動襯靜」的典型筆法。","src":"2019 DSE 卷一 甲部（改編）"},{"id":"A-shanju-3","tag":"內容理解","stem":"「竹喧歸浣女，蓮動下漁舟」的描寫順序是：","options":["只寫景不寫人","先寫人後寫景","先寫舟後寫人","先聞其聲、見其動，後知人歸舟下"],"answer":3,"explain":"因竹林喧鬧而知浣女歸來，因蓮葉搖動而知漁舟下行，屬側面描寫，饒有生活氣息。","src":"模擬題"},{"id":"A-shanju-4","tag":"主旨","stem":"尾聯「隨意春芳歇，王孫自可留」表達作者：","options":["思念遠方親友","嚮往隱居、留戀山林之情","感嘆春光易逝","不滿朝政腐敗"],"answer":1,"explain":"「王孫」自指，反用《楚辭·招隱士》「王孫兮歸來」之意，表明甘願留在山中。","src":"模擬題"},{"id":"A-shanju-5","tag":"體裁","stem":"《山居秋暝》的體裁是：","options":["五言古詩","七言律詩","五言律詩","五言絕句"],"answer":2,"explain":"全詩八句，每句五言，中間兩聯對仗，押平聲韻，屬五言律詩。","src":"模擬題"},{"id":"A-shanju-6","tag":"深層理解","stem":"「明月松間照」如何寄寓作者高潔的品格？最貼切的分析是：","options":["以明月與青松象徵澄澈堅貞，寄託不與世俗同流合污的情操","以松樹表示長壽之願","純粹寫景，別無寄託","以明月表示思鄉之情"],"answer":0,"explain":"月之皎潔、松之挺拔皆為傳統高潔意象，景中寓情、托物言志，是山水詩情景交融的關鍵。","src":"2025 DSE 卷一 甲部（考生回憶·改編）"},{"id":"A-shanju-7","tag":"詞解","stem":"「天氣晚來秋」中，「晚」的意思是：","options":["近來","遲來","傍晚","晚年"],"answer":2,"explain":"「晚」指傍晚。雨後傍晚秋意更濃，點明題中「秋暝」（秋天的傍晚）。","src":"模擬題"},{"id":"A-shanju-8","tag":"內容理解","stem":"題目「山居秋暝」的「暝」字意思是：","options":["黃昏時分的光線","幽暗的山谷","明亮","日落、天黑"],"answer":3,"explain":"「暝」指日暮天黑。題目點明時地：山中居所、秋天的傍晚。","src":"模擬題"},{"id":"A-shanju-9","tag":"寫作手法","stem":"「清泉石上流」一句中以「流」字寫水，其效果是：","options":["說明水流湍急","以動態反襯山林之靜，並見水之清澈","寫出山勢陡峭","暗示秋水冰涼"],"answer":1,"explain":"泉水在石上流淌，既有聲又有形，動中見靜，是全詩以動襯靜的核心意象。","src":"模擬題"},{"id":"A-shanju-10","tag":"修辭","stem":"頷聯「明月松間照，清泉石上流」與頸聯「竹喧歸浣女，蓮動下漁舟」皆：","options":["對仗工整，為律詩的中間兩聯","運用典故","自由抒寫，不拘格律","運用誇張"],"answer":0,"explain":"律詩要求頷聯、頸聯對仗。兩聯皆名詞對名詞、動詞對動詞，工整自然。","src":"模擬題"},{"id":"A-shanju-11","tag":"詞解","stem":"「隨意春芳歇」中，「歇」的意思是：","options":["盡興","凋零、消歇","休息","停止歌唱"],"answer":1,"explain":"「歇」解作凋謝、消歇。春天的花草任其凋謝，反襯秋景之可愛。","src":"模擬題"},{"id":"A-shanju-12","tag":"內容理解","stem":"「空山新雨後」一句營造的意境是：","options":["荒涼寂寞","肅穆莊嚴","清新澄澈、幽靜空靈","蕭瑟淒清"],"answer":2,"explain":"雨後空山，空氣清新而萬籟俱寂，為全詩奠定清幽的基調。","src":"模擬題"},{"id":"A-shanju-13","tag":"內容理解","stem":"詩中出現「浣女」「漁舟」，其作用主要是：","options":["以人間煙火氣反襯山中生活的淳樸可親","說明山中人多","交代作者的生計","批評世俗生活"],"answer":0,"explain":"山中雖幽靜而不荒寂，浣女漁舟的寫入令山居生活充滿生氣與人情味。","src":"模擬題"},{"id":"A-shanju-14","tag":"詞解","stem":"「蓮動下漁舟」中，「下」的用法是：","options":["下達","下面","落下","名詞作動詞，順流而下"],"answer":3,"explain":"「下」作動詞，指漁舟順流而下。蓮葉搖動方知舟行，屬間接描寫。","src":"模擬題"},{"id":"A-shanju-15","tag":"主旨","stem":"本詩的主旨最宜概括為：","options":["描繪秋日山居的清幽景色，寄寓嚮往隱逸、高潔自守的情懷","抒發懷才不遇之悲","記述一次山中遊歷","表達思鄉念友之情"],"answer":0,"explain":"寫景是表層，歸宿在尾聯「自可留」的隱逸之志與高潔品格。","src":"模擬題"},{"id":"A-shanju-16","tag":"寫作手法","stem":"全詩寫景運用了視覺與聽覺結合，下列兼具二者的是：","options":["王孫自可留","空山新雨後","明月松間照，清泉石上流","隨意春芳歇"],"answer":2,"explain":"月照松間為視覺，泉流石上有聲為聽覺，視聽交織，境界全出。","src":"模擬題"},{"id":"A-shanju-17","tag":"內容理解","stem":"詩中「松」「清泉」「蓮」等意象，共同象徵：","options":["秋天的蕭瑟","隱居的艱苦","長壽與富貴","高潔、澄明的人格"],"answer":3,"explain":"松之堅貞、泉之清澈、蓮之出淤泥而不染，皆傳統高潔意象，托物寄意。","src":"模擬題"},{"id":"A-shanju-18","tag":"深層理解","stem":"「王孫自可留」反用《楚辭·招隱士》之意，其效果為：","options":["表示無奈妥協","表明不願歸去、甘於隱居，語氣更為決絕","表示嚮往仕途","表示思念友人"],"answer":1,"explain":"《招隱士》呼喚「王孫兮歸來」，王維反其意而用之，故著一「自」字見其主動選擇。","src":"模擬題"},{"id":"A-shanju-19","tag":"寫作手法","stem":"本詩寫景由上文到下文，其觀察順序是：","options":["由天空到地面，再由竹林到水面，層次井然","由近而遠","由內而外","由晝至夜"],"answer":0,"explain":"「明月」（天）→「清泉」（地）→「竹喧」（林）→「蓮動」（水），空間層次分明。","src":"模擬題"},{"id":"A-shanju-20","tag":"風格","stem":"後人評王維詩「詩中有畫」，本詩最足以印證的是：","options":["情感激越","以鮮明的色彩與構圖呈現山水，畫意盎然","議論精警","善用典故"],"answer":1,"explain":"月、松、泉、石、竹、蓮構成清麗畫面，故蘇軾譽其「詩中有畫」。","src":"模擬題"}]},{"id":"A-yuexia","title":"唐詩三首 · 月下獨酌（其一）","sub":"李白 · 五言古詩","questions":[{"id":"A-yuexia-1","tag":"詞解","stem":"「月既不解飲，影徒隨我身」中，「解」的意思是：","options":["解除","解開","懂得、能夠","解釋"],"answer":2,"explain":"「不解飲」即不懂得飲酒。詩人賦予月與影以人格，故有此責怪，實則寫己之孤獨。","src":"模擬題"},{"id":"A-yuexia-2","tag":"詞解","stem":"「暫伴月將影，行樂須及春」中，「將」的意思是：","options":["率領","拿","將要","和、與"],"answer":3,"explain":"「將」作連詞，解作「與、共」。句意：姑且與月和影為伴，及時行樂。","src":"模擬題"},{"id":"A-yuexia-3","tag":"修辭","stem":"「我歌月徘徊，我舞影零亂」運用的修辭手法是：","options":["誇張","擬人","對偶","比喻"],"answer":1,"explain":"月「徘徊」、影「零亂」皆以人之情態寫物，把月與影寫成可共飲同樂的伴侶。","src":"模擬題"},{"id":"A-yuexia-4","tag":"深層理解","stem":"全詩以「獨」字貫穿，其情感基調最宜概括為：","options":["閒適恬淡","純粹歡樂暢飲","表面放達行樂，實則孤寂落寞","憤世嫉俗"],"answer":2,"explain":"由「獨酌」到邀月與影，再到「醉後各分散」，熱鬧愈盛而孤獨愈深，是以樂寫哀。","src":"模擬題"},{"id":"A-yuexia-5","tag":"體裁","stem":"《月下獨酌（其一）》的體裁是：","options":["五言古詩","樂府詩","五言絕句","五言律詩"],"answer":0,"explain":"全詩十四句，句式自由不求對仗，用韻亦較靈活，屬五言古詩。","src":"模擬題"},{"id":"A-yuexia-6","tag":"內容理解","stem":"「花間一壺酒，獨酌無相親」在結構上的作用是：","options":["描寫花園景色","引出下文對月的讚美","開篇點題，交代獨飲的處境，奠定孤寂基調","說明酒的來歷"],"answer":2,"explain":"「獨」「無相親」二字直揭孤單，為下文「邀明月」「對影」的奇想提供動機。","src":"模擬題"},{"id":"A-yuexia-7","tag":"內容理解","stem":"「舉杯邀明月，對影成三人」中的「三人」指：","options":["月、影、酒","三位詩人","詩人與兩位友人","詩人、明月、詩人的影子"],"answer":3,"explain":"「三人」是詩人的奇想：自己加月與影，湊成三人，愈見其孤獨中的自我寬慰。","src":"模擬題"},{"id":"A-yuexia-8","tag":"詞解","stem":"「影徒隨我身」中，「徒」的意思是：","options":["徒弟","徒然、白白地","步行","只是"],"answer":1,"explain":"「徒」解作徒然。影雖相隨卻不能共飲，故曰徒然，孤獨之意更深一層。","src":"模擬題"},{"id":"A-yuexia-9","tag":"內容理解","stem":"「暫伴月將影」中的「暫」字蘊含的意味是：","options":["明知相伴短暫，故須及時行樂","長久相伴","偶然相遇","勉強湊合"],"answer":0,"explain":"「暫」字透露出這場歡會終將散去，與結句「醉後各分散」遙相呼應。","src":"模擬題"},{"id":"A-yuexia-10","tag":"內容理解","stem":"「行樂須及春」的「春」象徵：","options":["春天景物","美好的時光","酒興正濃","青春年華"],"answer":1,"explain":"「及春」即趁著美好時光。表面寫及時行樂，實則反襯歡樂之短暫。","src":"模擬題"},{"id":"A-yuexia-11","tag":"寫作手法","stem":"「我歌月徘徊，我舞影零亂」中月與影的動態描寫，其作用是：","options":["說明月光隨人移動","描寫舞蹈之美","以物之相伴寫人之狂歡，愈狂歡愈見孤獨","寫出醉態可掬"],"answer":2,"explain":"月與影似解人意而相陪，實為詩人醉中幻覺，熱鬧是自造的，孤獨是真實的。","src":"模擬題"},{"id":"A-yuexia-12","tag":"內容理解","stem":"「醒時同交歡，醉後各分散」寫出：","options":["相聚之樂與分離之快的對比，歡樂難久","飲酒的害處","交友之道","醒時與醉後的心情不同"],"answer":0,"explain":"「同交歡」與「各分散」對比，點出這場月影之會終歸虛幻。","src":"模擬題"},{"id":"A-yuexia-13","tag":"詞解","stem":"「永結無情遊，相期邈雲漢」中，「無情」的意思是：","options":["冷酷無情","無緣無故","沒有感情","超脫世俗、無所牽掛"],"answer":3,"explain":"「無情遊」指超脫世俗之情的精神之交。與月影結遊，正是要擺脫人間的牽累。","src":"模擬題"},{"id":"A-yuexia-14","tag":"詞解","stem":"「相期邈雲漢」中，「邈」的意思是：","options":["遙遠","渺小","接近","超越"],"answer":0,"explain":"「邈」解作遙遠。相約於遙遠的天河，寫出超越塵世的精神寄託。","src":"模擬題"},{"id":"A-yuexia-15","tag":"詞解","stem":"「相期邈雲漢」中，「雲漢」指的是：","options":["雲與漢水","仙境","天河、銀河","高空"],"answer":2,"explain":"「雲漢」即銀河。與月相約於銀河之上，想像瑰奇，是浪漫主義的典型筆法。","src":"模擬題"},{"id":"A-yuexia-16","tag":"寫作手法","stem":"本詩最突出的藝術特色是：","options":["用典精確","議論深刻","對仗工整","想像奇特，以月影為友，浪漫奔放"],"answer":3,"explain":"邀月對影、結遊雲漢，想像天馬行空，充分體現李白浪漫主義詩風。","src":"模擬題"},{"id":"A-yuexia-17","tag":"深層理解","stem":"「獨」字在全詩中反覆或間接出現，其作用是：","options":["點明天氣","統攝全篇，所有熱鬧場面皆由此孤獨生出","與題目呼應而已","僅指飲酒時無人相伴"],"answer":1,"explain":"由「獨酌」起，中經邀月成三人之樂，終歸「各分散」，全篇皆由「獨」字生發。","src":"模擬題"},{"id":"A-yuexia-18","tag":"主旨","stem":"下列對本詩主旨的理解，最恰切的是：","options":["借月夜獨飲，抒發政治上失意與知音難覓的孤獨，並以狂放自遣","勸人及時行樂","描寫飲酒之樂","歌頌月夜之美"],"answer":0,"explain":"李白供奉翰林而不得志，詩中孤獨非僅無人對飲，更含懷才不遇之慨。","src":"模擬題"},{"id":"A-yuexia-19","tag":"寫作手法","stem":"詩中「以樂寫哀」的具體表現是：","options":["以哀景寫樂情","極寫歌舞交歡之樂，結以「各分散」，哀意自見","通篇議論抒情","以悲景寫悲情"],"answer":1,"explain":"樂寫得越熱鬧，越顯得這場歡會的虛幻，哀感因而更深，是反襯的妙用。","src":"模擬題"},{"id":"A-yuexia-20","tag":"內容理解","stem":"「舉杯邀明月」的「邀」字好處在於：","options":["表示禮節周到","寫出舉杯的動作","把月擬人化為可邀請的對象，見詩人的天真與豪放","說明月的明亮"],"answer":2,"explain":"「邀」字是詩眼，一舉將月與影化為賓客，全詩意境由此展開。","src":"模擬題"}]},{"id":"A-denglou","title":"唐詩三首 · 登樓","sub":"杜甫 · 七言律詩","questions":[{"id":"A-denglou-1","tag":"寫作手法","stem":"「花近高樓傷客心」以繁花近樓起筆反而「傷心」，其手法是：","options":["對比古今","用典","借代","以樂景寫哀情，倍增其哀"],"answer":3,"explain":"花開正盛而詩人登樓觸目傷情，樂景反襯哀情，是杜甫沉鬱頓挫的典型筆法。","src":"2020 DSE 卷一 甲部（改編）"},{"id":"A-denglou-2","tag":"寫作手法","stem":"「錦江春色來天地，玉壘浮雲變古今」寫景的特點是：","options":["奇險怪誕，想像奇特","氣象恢宏，時空開闊，情景交融","纖細柔婉，著重細節","平淡質樸，白描取勝"],"answer":1,"explain":"「來天地」寫空間之闊，「變古今」寫時間之遠，兩句囊括天地古今，故譽為氣象雄渾。","src":"2020 DSE 卷一 甲部（改編）"},{"id":"A-denglou-3","tag":"修辭","stem":"「北極朝廷終不改」中，「北極」運用借代，指代：","options":["皇帝本人","北方邊境","朝廷、唐室","星空"],"answer":2,"explain":"「北極」本指北極星，古人以之象徵朝廷所在。句意：唐室正統終不可動搖。","src":"模擬題"},{"id":"A-denglou-4","tag":"內容理解","stem":"「可憐後主還祠廟，日暮聊為梁甫吟」運用典故，寄意是：","options":["借劉禪亡國之典寄寓對國事的憂慮與自身懷才不遇","抒發思鄉之情","詠嘆成都名勝","歌頌諸葛亮的功績"],"answer":0,"explain":"後主昏庸亡國而有祠廟，暗諷當代君主；「梁甫吟」為諸葛亮未遇時所愛吟之曲。","src":"2020 DSE 卷一 甲部（改編）"},{"id":"A-denglou-5","tag":"體裁","stem":"《登樓》的體裁是：","options":["樂府詩","七言絕句","七言律詩","七言古詩"],"answer":2,"explain":"全詩八句，每句七言，中兩聯對仗工整，平仄嚴謹，屬七言律詩。","src":"模擬題"},{"id":"A-denglou-6","tag":"詞解","stem":"「萬方多難此登臨」中，「萬方」的意思是：","options":["邊遠地區","多方勢力","萬種方法","全國各地"],"answer":3,"explain":"「萬方」指全國各地。吐蕃入侵、藩鎮割據，故曰多難，是全詩憂國之情的根源。","src":"模擬題"},{"id":"A-denglou-7","tag":"修辭","stem":"「錦江春色來天地，玉壘浮雲變古今」在修辭上主要運用：","options":["擬人","對偶，且時空對舉","比喻","誇張"],"answer":1,"explain":"錦江對玉壘、春色對浮雲、來對變、天地對古今，工對之中見時空之闊大。","src":"模擬題"},{"id":"A-denglou-8","tag":"內容理解","stem":"「玉壘」在詩中指的是：","options":["玉壘山，在四川，代指蜀地","關隘名","玉砌的城牆","美玉堆疊"],"answer":0,"explain":"玉壘山在成都西北。浮雲變幻自古至今，暗喻世事動盪、國運飄搖。","src":"模擬題"},{"id":"A-denglou-9","tag":"內容理解","stem":"「西山寇盜莫相侵」中的「寇盜」指：","options":["盜賊流寇","入侵的吐蕃","藩鎮軍閥","安史叛軍"],"answer":1,"explain":"「西山」指成都西面的雪山，時吐蕃屢犯西川，故有此語，見詩人憂邊之心。","src":"模擬題"},{"id":"A-denglou-10","tag":"詞解","stem":"「日暮聊為梁甫吟」中，「聊」的意思是：","options":["依賴","略微","姑且","聊天"],"answer":2,"explain":"「聊」解作姑且。日暮時分姑且吟誦《梁甫吟》，寄託報國無門之慨。","src":"模擬題"},{"id":"A-denglou-11","tag":"內容理解","stem":"「可憐後主還祠廟」中的「可憐」應理解為：","options":["可惜、可嘆","可愛","值得同情","憐憫"],"answer":0,"explain":"「可憐」在此為可惜之意。後主昏庸亡國卻仍有祠廟受祭，語含諷刺與慨嘆。","src":"模擬題"},{"id":"A-denglou-12","tag":"內容理解","stem":"「傷客心」中的「客」指：","options":["來訪的客人","登樓的遊客","旅居的商人","詩人自己，漂泊異鄉之人"],"answer":3,"explain":"杜甫避亂入蜀，自稱「客」。客中登樓，故傷情尤深。","src":"模擬題"},{"id":"A-denglou-13","tag":"主旨","stem":"本詩的主旨最宜概括為：","options":["登樓覽景而憂國傷時，兼寓懷才不遇之慨","記述登樓所見","讚美成都的名勝","抒發思鄉之情"],"answer":0,"explain":"由「萬方多難」到「朝廷終不改」再到「梁甫吟」，憂國與自傷交織，是杜甫晚年律詩的典型。","src":"模擬題"},{"id":"A-denglou-14","tag":"結構","stem":"全詩的層次安排是：","options":["通篇寫景","通篇抒情","首聯敘登樓緣由，頷頸聯寫景，尾聯用典抒懷","先議論後寫景"],"answer":2,"explain":"起承轉合井然：起於登臨，承接以天地古今之景，轉入朝廷寇盜之憂，合於梁甫之吟。","src":"模擬題"},{"id":"A-denglou-15","tag":"風格","stem":"「沉鬱頓挫」在本詩中的體現是：","options":["辭采華麗","意境飄逸","語言詼諧","情感深沉而抑揚起伏，字句凝練有力"],"answer":3,"explain":"「沉鬱」指情感深厚，「頓挫」指音節與章法的抑揚。全詩字字凝重，讀來頓挫有致。","src":"模擬題"},{"id":"A-denglou-16","tag":"寫作手法","stem":"首聯「花近高樓傷客心，萬方多難此登臨」的語序特點是：","options":["並列寫景","因果倒裝：因萬方多難，故見花而傷心","順敘時序","設問起筆"],"answer":1,"explain":"正常因果應為「萬方多難此登臨，花近高樓傷客心」，倒裝後先見反常之情，再點明原因，震撼力更強。","src":"模擬題"},{"id":"A-denglou-17","tag":"內容理解","stem":"「北極朝廷終不改，西山寇盜莫相侵」兩句表現詩人：","options":["對國家正統的信心與對外患的憤慨","對戰爭的厭倦","對朝廷的失望","對君主的諂媚"],"answer":0,"explain":"「終不改」三字斬釘截鐵，見其堅定；「莫相侵」則是對入侵者的正色警告。","src":"模擬題"},{"id":"A-denglou-18","tag":"深層理解","stem":"詩人以「後主」自比的用意是：","options":["自嘆無能","借後主昏庸致禍，暗諷當代君主未能親賢遠佞","表達亡國之痛","歌頌諸葛亮"],"answer":1,"explain":"後主寵信黃皓而亡國，與當代君主任用宦官、藩鎮坐大相似，諷諫之意甚明。","src":"模擬題"},{"id":"A-denglou-19","tag":"用典","stem":"「梁甫吟」一典的作用，最恰切的是：","options":["交代詩人所處之地","描寫音樂之美","以諸葛亮未遇時所吟之曲自況，表達渴慕賢臣與報國無門","說明諸葛亮的功績"],"answer":2,"explain":"《梁甫吟》相傳為諸葛亮躬耕時所好，杜甫以此自比，暗寓濟世之志無由施展。","src":"模擬題"},{"id":"A-denglou-20","tag":"寫作手法","stem":"「日暮」一詞在全詩中的作用是：","options":["表示天將降雨","交代登樓的時間","描寫夕陽之美","既寫實景，又象徵國勢日衰與詩人遲暮，一語雙關"],"answer":3,"explain":"「日暮」兼含時、勢、身三層，與篇末「聊為」的無奈呼應，含蓄不盡。","src":"模擬題"}]},{"id":"A-niannu","title":"詞三首 · 念奴嬌·赤壁懷古","sub":"蘇軾 · 豪放詞","questions":[{"id":"A-niannu-1","tag":"寫作手法","stem":"起筆「大江東去，浪淘盡，千古風流人物」的作用是：","options":["描寫戰爭場面","以奔騰江水起興，營造闊大時空，引出懷古之情","點明作者身世","交代赤壁的地理位置"],"answer":1,"explain":"空間上的「大江」與時間上的「千古」交織，氣勢磅礴，為全詞懷古傷今定調。","src":"模擬題"},{"id":"A-niannu-2","tag":"內容理解","stem":"「羽扇綸巾，談笑間，檣櫓灰飛煙滅」所寫的人物是：","options":["孫權","諸葛亮","周瑜","曹操"],"answer":2,"explain":"「羽扇綸巾」寫儒將從容之態，詞中明言「遙想公瑾當年」，故指周瑜。","src":"模擬題"},{"id":"A-niannu-3","tag":"句式","stem":"「多情應笑我，早生華髮」的句式特點是：","options":["倒裝（應笑我多情）","被動句","判斷句","省略句"],"answer":0,"explain":"正常語序為「應笑我多情」，為協律與強調而倒裝。","src":"模擬題"},{"id":"A-niannu-4","tag":"深層理解","stem":"作者借周瑜形象所抒發的感慨是：","options":["讚美東吳的強盛","批評曹操驕兵必敗","羨慕其年少功成，反襯自身年華老去、功業未成","嚮往隱居生活"],"answer":2,"explain":"公瑾三十四歲破曹，而詞人四十七歲貶謫黃州，「早生華髮」正是此落差。宜點出「借古人之事，抒本人之情」。","src":"2026 DSE 卷一 甲部（考生回憶·改編）"},{"id":"A-niannu-5","tag":"主旨","stem":"結句「人生如夢，一尊還酹江月」的情感是：","options":["怨恨朝廷不公","徹底消極厭世","豪情萬丈，志在必得","豁達中見無奈，借酒弔月以自我排遣"],"answer":3,"explain":"以「人生如夢」消解功業未成之悲，以酹月之舉見其曠達，感慨與超脫並存，不宜只答一面。","src":"模擬題"},{"id":"A-niannu-6","tag":"內容理解","stem":"「亂石穿空，驚濤拍岸，捲起千堆雪」描寫的對象是：","options":["雪景","赤壁的險峻地勢與洶湧波濤","赤壁之戰的場面","江上的漁船"],"answer":1,"explain":"三句分別寫山石、巨浪、浪花，共同構成赤壁雄奇的畫面。","src":"模擬題"},{"id":"A-niannu-7","tag":"修辭","stem":"「捲起千堆雪」運用的修辭手法是：","options":["比喻，以雪喻浪花","擬人","誇張","借代"],"answer":0,"explain":"浪花潔白而層層堆疊，故以雪為喻，形象鮮明，兼具誇張意味。","src":"模擬題"},{"id":"A-niannu-8","tag":"內容理解","stem":"「江山如畫，一時多少豪傑」在結構上的作用是：","options":["總結上片","由寫景過渡到懷古，承上啟下","抒發感慨","點明主旨"],"answer":1,"explain":"「江山如畫」收束上片之景，「多少豪傑」開啟下片之人事，是典型的過渡句。","src":"模擬題"},{"id":"A-niannu-9","tag":"內容理解","stem":"「遙想公瑾當年，小喬初嫁了」寫小喬初嫁，其用意是：","options":["交代周瑜的家世","說明戰爭的背景","以美人襯英雄，見周瑜年少得意、風采照人","描寫婚禮的盛況"],"answer":2,"explain":"初嫁之喜與雄姿英發相映，極寫周瑜少年得志，與詞人「早生華髮」形成對照。","src":"模擬題"},{"id":"A-niannu-10","tag":"詞解","stem":"「雄姿英發」中的「英發」意思是：","options":["才氣煥發、神采飛揚","英年早逝","英俊瀟灑","英勇出擊"],"answer":0,"explain":"「英發」狀才華與精神煥發之貌，寫周瑜意氣風發的將帥風采。","src":"模擬題"},{"id":"A-niannu-11","tag":"修辭","stem":"「檣櫓灰飛煙滅」中，「檣櫓」運用借代，指代：","options":["水軍将士","武器裝備","船上的桅杆","戰船，引申指曹軍"],"answer":3,"explain":"「檣」為桅杆、「櫓」為划槳，合代戰船；灰飛煙滅即曹軍覆沒。","src":"模擬題"},{"id":"A-niannu-12","tag":"詞解","stem":"「故國神遊，多情應笑我」中，「故國」指的是：","options":["赤壁古戰場","舊日的京城","詞人的故鄉","已滅亡的國家"],"answer":0,"explain":"「故國」即當年三國赤壁之地。神遊其間而自笑多情，是懷古詞的常見收束方式。","src":"模擬題"},{"id":"A-niannu-13","tag":"內容理解","stem":"「早生華髮」一句寄寓的是：","options":["對友人的思念","對戰爭的恐懼","年華老去而功業未成的悲慨","對鏡自賞之情"],"answer":2,"explain":"「華髮」即白髮。與「雄姿英發」的周瑜對照，落差全在此四字。","src":"模擬題"},{"id":"A-niannu-14","tag":"風格","stem":"本詞被譽為豪放詞的代表，下列何者最能體現豪放風格？","options":["多用典故","篇幅短小","用語婉約細膩","意象宏大，氣勢奔放，不拘音律格套"],"answer":3,"explain":"大江、亂石、驚濤、千堆雪等意象極為壯闊，情感奔放，故為豪放派的典範。","src":"模擬題"},{"id":"A-niannu-15","tag":"詞解","stem":"「浪淘盡，千古風流人物」中，「風流」的意思是：","options":["風度翩翩的","傑出而有功業的","風雅的","放蕩不羈的"],"answer":1,"explain":"「風流人物」指出類拔萃、有英雄業績的人物，非指男女之事。","src":"模擬題"},{"id":"A-niannu-16","tag":"體裁","stem":"「念奴嬌」是詞牌，「赤壁懷古」是：","options":["詞題，標明所詠內容","曲調名","詞牌的另一名稱","作者自號"],"answer":0,"explain":"詞牌規定格律，詞題標示內容。故考題如問「詞牌」與「題目」須分辨清楚。","src":"模擬題"},{"id":"A-niannu-17","tag":"內容理解","stem":"「人道是，三國周郎赤壁」中，「人道是」三字的作用是：","options":["表示作者懷疑","表明此地相傳為赤壁，非作者考證，語氣留有餘地","引出下文議論","肯定此地即赤壁"],"answer":1,"explain":"「人道是」即「人們說是」，不作斷言，可見作者意在抒情而非考據。","src":"模擬題"},{"id":"A-niannu-18","tag":"結構","stem":"本詞上片與下片的內容分工是：","options":["上片抒情，下片寫景","上下片皆寫景","上片寫景，下片懷古抒情","上下片皆議論"],"answer":2,"explain":"上片極寫赤壁雄奇，下片遙想周瑜而歸於自傷，是懷古詞的典型結構。","src":"模擬題"},{"id":"A-niannu-19","tag":"寫作手法","stem":"「亂石穿空」中的「穿」字好處在於：","options":["說明山石中空","描寫石頭的形狀","表示穿透之意","寫出山石高聳插天的態勢，極具力度"],"answer":3,"explain":"「穿」字化靜為動，令山石有刺破長空之勢，煉字之妙正在於此。","src":"模擬題"},{"id":"A-niannu-20","tag":"主旨","stem":"綜合全詞，作者的情感脈絡是：","options":["由悲傷而絕望","由平淡而激昂","由豪邁而感慨，終歸曠達","由歡樂而悲傷"],"answer":2,"explain":"起筆豪邁、中段羨慕、末段自嘲而以酹月作結，三層情感層層推進。","src":"模擬題"}]},{"id":"A-shengsheng","title":"詞三首 · 聲聲慢·秋情","sub":"李清照 · 婉約詞","questions":[{"id":"A-shengsheng-1","tag":"修辭","stem":"開篇「尋尋覓覓，冷冷清清，悽悽慘慘戚戚」十四疊字的作用是：","options":["點出全詞主旨","交代季節","層層遞進渲染孤寂淒涼，富音樂美","描寫居所環境"],"answer":2,"explain":"由動作而環境而心境，遞進而下；疊字連用讀來頓挫哀婉，歷來被譽為卓絕千古。","src":"模擬題"},{"id":"A-shengsheng-2","tag":"詞解","stem":"「乍暖還寒時候，最難將息」中，「將息」的意思是：","options":["調養、休息","停止","將要休息","喘息"],"answer":0,"explain":"「將息」為宋人口語，解作休養、保重。天氣忽暖忽寒，身體最難調養。","src":"模擬題"},{"id":"A-shengsheng-3","tag":"修辭","stem":"「滿地黃花堆積，憔悴損」中，「黃花」指的是：","options":["油菜花","桂花","菊花","落葉"],"answer":2,"explain":"「黃花」為菊花的雅稱。菊之憔悴亦如人之憔悴，是以花自喻，物我交融。","src":"模擬題"},{"id":"A-shengsheng-4","tag":"寫作手法","stem":"「梧桐更兼細雨，到黃昏、點點滴滴」的寫法是：","options":["用典","直抒胸臆","議論說理","以景結情，雨聲點滴烘托愁緒無盡"],"answer":3,"explain":"雨打梧桐，點滴到黃昏，聲聲皆是愁。以景語作結而不言愁，愁意自見。","src":"模擬題"},{"id":"A-shengsheng-5","tag":"主旨","stem":"全詞的主旨是抒寫：","options":["對青春易逝的傷感","喪夫之痛、漂泊無依與故國之思交織的深沉哀愁","對戰亂的憤怒","秋日賞菊的閒情"],"answer":1,"explain":"詞作於南渡之後，融喪亂、喪夫、漂泊、思鄉於一，末句「怎一個愁字了得」收束於無言之痛。","src":"模擬題"},{"id":"A-shengsheng-6","tag":"詞解","stem":"「乍暖還寒」中，「還」的讀音與意思是：","options":["huán，仍然、又（忽暖忽寒）","hái，尚且","hái，還有","huán，歸還"],"answer":0,"explain":"「還」讀 huán，解作又、仍然。寫氣候反覆無常，亦喻心境之不寧。","src":"模擬題"},{"id":"A-shengsheng-7","tag":"內容理解","stem":"「三杯兩盞淡酒，怎敵他、晚來風急」說明：","options":["酒味太淡","酒力不足以抵禦晚風，更不足以消解愁緒","天氣轉涼","飲酒傷身"],"answer":1,"explain":"「怎敵他」以反問出之，見愁之深重非酒可解，是全詞由景入情的關鍵。","src":"模擬題"},{"id":"A-shengsheng-8","tag":"內容理解","stem":"「雁過也，正傷心，卻是舊時相識」中，「舊時相識」的含意是：","options":["雁年年南飛","雁從故鄉飛來","昔日曾為傳書之雁，今見之更添故人之思","曾經養過的雁"],"answer":2,"explain":"雁足傳書本為故典；如今故人已逝、故土已失，雁依舊而人事全非。","src":"模擬題"},{"id":"A-shengsheng-9","tag":"詞解","stem":"「滿地黃花堆積，憔悴損，如今有誰堪摘」中，「損」的意思是：","options":["極，表示程度深","損壞","損失","減少"],"answer":0,"explain":"「損」用在形容詞後表程度之深，如「憔悴損」即極為憔悴。","src":"模擬題"},{"id":"A-shengsheng-10","tag":"深層理解","stem":"「如今有誰堪摘」一句的言外之意是：","options":["菊花無人照料","菊花已凋謝","無人採摘菊花","昔日摘花之人已不在，無人共賞，亦無心賞"],"answer":3,"explain":"趙明誠逝後，無人共賞亦無心賞花，「有誰」二字問得淒涼。","src":"模擬題"},{"id":"A-shengsheng-11","tag":"詞解","stem":"「守著窗兒，獨自怎生得黑」中，「怎生」的意思是：","options":["怎麼、怎樣","為何而生","怎麼生活","怎能忍受"],"answer":0,"explain":"「怎生」為宋人口語，解作怎麼。獨坐窗前，如何挨到天黑，寫盡孤寂難熬。","src":"模擬題"},{"id":"A-shengsheng-12","tag":"詞解","stem":"「這次第，怎一個愁字了得」中，「次第」的意思是：","options":["次序","轉眼","情形、光景","依次"],"answer":2,"explain":"「次第」解作情景、狀況。種種光景豈是一個「愁」字所能說盡。","src":"模擬題"},{"id":"A-shengsheng-13","tag":"主旨","stem":"結句「怎一個愁字了得」的妙處在於：","options":["表達無奈之情","歸納上文景物","點明全詞主旨","以否定「愁」字作結，見愁之深廣無可言說"],"answer":3,"explain":"說「一個愁字」不足，正見愁之層層疊疊，比直說「愁極」更為有力。","src":"模擬題"},{"id":"A-shengsheng-14","tag":"風格","stem":"本詞屬婉約詞，下列何者最能體現婉約特色？","options":["議論縱橫","情感細膩含蓄，多以景物烘托，語言婉轉","用典繁密","氣象恢宏"],"answer":1,"explain":"全詞借淡酒、急風、過雁、黃花、梧桐細雨層層渲染，含蓄委婉，是婉約派的代表。","src":"模擬題"},{"id":"A-shengsheng-15","tag":"寫作手法","stem":"全詞多用口語入詞（如「將息」「怎生」「次第」），其效果是：","options":["自然真切，如話家常，倍增淒楚之感","增強議論性","使篇幅加長","使詞更為典雅"],"answer":0,"explain":"李清照善用淺語寫深情，口語入詞令情感不加掩飾，格外動人。","src":"模擬題"},{"id":"A-shengsheng-16","tag":"寫作手法","stem":"「冷冷清清」與「悽悽慘慘戚戚」的關係是：","options":["因果關係","由環境到心境，層層遞進","轉折關係","並列寫景"],"answer":1,"explain":"「冷冷清清」寫外在環境，「悽悽慘慘戚戚」寫內心感受，由外而內，愁緒漸深。","src":"模擬題"},{"id":"A-shengsheng-17","tag":"內容理解","stem":"「尋尋覓覓」四字寫的是：","options":["尋找失物","尋覓歸路","若有所失、四處搜尋的動作神態","尋找故人"],"answer":2,"explain":"覓而不得，故覺冷清。四字寫出恍惚若失的狀態，是全詞情感起點。","src":"模擬題"},{"id":"A-shengsheng-18","tag":"體裁","stem":"「聲聲慢」是詞牌，「秋情」是：","options":["曲調名","詞的序","作者的別號","詞題，點明所寫時令與情感"],"answer":3,"explain":"詞牌定格律，詞題標內容。「秋情」二字已點出悲秋的情調。","src":"模擬題"},{"id":"A-shengsheng-19","tag":"內容理解","stem":"下列哪一項不是本詞用以渲染愁緒的意象？","options":["過雁","梧桐細雨","烽火","淡酒"],"answer":2,"explain":"淡酒、急風、過雁、黃花、梧桐細雨皆為本詞意象；「烽火」見於李清照其他作品，非本詞所有。","src":"模擬題"},{"id":"A-shengsheng-20","tag":"深層理解","stem":"本詞寫「愁」而不明言愁之原因，其效果是：","options":["含蓄蘊藉，留白處更見哀痛之深","顯示作者詞藻不足","令人費解","削弱了感染力"],"answer":0,"explain":"全詞只寫感受與景物，不點破喪亂喪夫之痛，讀者自能意會，愈顯沉痛。","src":"模擬題"}]},{"id":"A-qingyuan","title":"詞三首 · 青玉案·元夕","sub":"辛棄疾 · 寄託","questions":[{"id":"A-qingyuan-1","tag":"內容理解","stem":"「東風夜放花千樹，更吹落、星如雨」所描寫的是：","options":["元宵節的燈火與煙火","流星雨","秋天的落葉","春天的花樹"],"answer":0,"explain":"「花千樹」喻燈火繁盛，「星如雨」喻煙花紛落，極寫元宵夜之熱鬧輝煌。","src":"模擬題"},{"id":"A-qingyuan-2","tag":"內容理解","stem":"「寶馬雕車香滿路」描寫的對象是：","options":["農家的牛車","官府的儀仗","貴族出遊的華麗車馬","商賈的貨車"],"answer":2,"explain":"寫達官貴人車馬華美、香氣滿路，與結句「燈火闌珊處」的孤寂形成強烈反差。","src":"模擬題"},{"id":"A-qingyuan-3","tag":"詞解","stem":"「鳳簫聲動，玉壺光轉」中，「玉壺」一般解作：","options":["酒壺","計時漏壺","玉製的燈","月亮"],"answer":3,"explain":"課文注釋多取「玉壺」指月亮，寫月光流轉；亦有注家解作漏壺或燈，答題以課本注釋為準。","src":"模擬題"},{"id":"A-qingyuan-4","tag":"寫作手法","stem":"全詞極寫元宵熱鬧，最終歸於「那人卻在，燈火闌珊處」，主要手法是：","options":["烘托：以靜襯動","反襯：以熱鬧反襯孤高","象徵：以燈喻志","對比：今昔對照"],"answer":1,"explain":"繁華愈盛，愈顯「那人」不隨流俗；熱鬧是為冷清作鋪墊，此即以眾襯獨。","src":"模擬題"},{"id":"A-qingyuan-5","tag":"深層理解","stem":"「那人」的形象最宜理解為：","options":["自甘寂寞、不與世俗同流合污的高潔人格，亦寄寓作者自況","觀燈的平民","隱居的友人","作者思念的戀人"],"answer":0,"explain":"梁啟超評此詞「自憐幽獨，傷心人別有懷抱」，「那人」實為作者理想人格的化身。","src":"2018 DSE 卷一 甲部（改編）"},{"id":"A-qingyuan-6","tag":"詞解","stem":"「鳳簫聲動」中的「鳳簫」指的是：","options":["一種燈飾","排簫，泛指音樂","鳳凰的鳴聲","笛子"],"answer":1,"explain":"「鳳簫」即排簫，狀其聲如鳳鳴。寫元宵夜樂聲四起，熱鬧非常。","src":"模擬題"},{"id":"A-qingyuan-7","tag":"內容理解","stem":"「蛾兒雪柳黃金縷」描寫的是：","options":["街市的陳設","燈籠的形狀","婦女頭上的裝飾","舞隊的服飾"],"answer":2,"explain":"蛾兒、雪柳、黃金縷皆宋代元宵婦女的頭飾，寫觀燈女子盛裝出遊。","src":"模擬題"},{"id":"A-qingyuan-8","tag":"內容理解","stem":"「笑語盈盈暗香去」寫眾多女子：","options":["嬌笑而去，只留暗香，烘托「那人」之不隨眾","邀作者同遊","與作者相識","在人群中走失"],"answer":0,"explain":"「盈盈」狀儀態，「暗香」寫其遠去，眾人皆去而「那人」獨留於闌珊處。","src":"模擬題"},{"id":"A-qingyuan-9","tag":"詞解","stem":"「眾裏尋他千百度」中，「度」的意思是：","options":["度過","程度","度量","次"],"answer":3,"explain":"「千百度」即千百次。極言尋覓之頻、之苦，為「驀然回首」的驚喜蓄勢。","src":"模擬題"},{"id":"A-qingyuan-10","tag":"詞解","stem":"「驀然回首」中，「驀然」的意思是：","options":["忽然","緩緩","驀地驚起","不經意地"],"answer":0,"explain":"「驀然」解作忽然。由千百度之苦尋到忽然回首之偶得，是全詞最富戲劇性的一轉。","src":"模擬題"},{"id":"A-qingyuan-11","tag":"詞解","stem":"「那人卻在，燈火闌珊處」中，「闌珊」的意思是：","options":["明亮","闌干","零落、稀疏，將盡","燦爛"],"answer":2,"explain":"「闌珊」解作衰落、稀疏。燈火零落之處，象徵冷清寂寞之地。","src":"模擬題"},{"id":"A-qingyuan-12","tag":"內容理解","stem":"題中「元夕」指的是：","options":["元旦","元月之初","新年的前夕","元宵節的夜晚"],"answer":3,"explain":"「元夕」即農曆正月十五元宵之夜，是宋代最盛大的燈節。","src":"模擬題"},{"id":"A-qingyuan-13","tag":"寫作手法","stem":"「那人」與上文的「眾人」形成的對比是：","options":["眾人歡樂，那人悲傷","眾人盛裝熱鬧，那人獨處冷清，凸顯不同流俗","眾人貧寒，那人富貴","眾人結伴，那人獨行"],"answer":1,"explain":"「眾裏尋他」正是要在萬千人中辨出那一個「不一樣」的人，對比是全詞的核心。","src":"模擬題"},{"id":"A-qingyuan-14","tag":"體裁","stem":"「青玉案」與「元夕」的關係是：","options":["前者為詞牌，後者為詞題","兩者皆為詞牌","前者為詞題，後者為詞牌","兩者皆為曲調"],"answer":0,"explain":"詞牌定格律、詞題標內容，是詞體常識，亦為常見考題。","src":"模擬題"},{"id":"A-qingyuan-15","tag":"深層理解","stem":"辛棄疾為豪放派詞人，本詞卻寫得婉約纏綿，其原因是：","options":["受李清照影響","借兒女之情寄託身世之慨，符合「寄託」的傳統","作者早期風格尚未成熟","應酬之作，隨筆寫成"],"answer":1,"explain":"以美人香草寄託政治懷抱，是自《楚辭》以來的傳統，豪放詞人亦常用此手法。","src":"模擬題"},{"id":"A-qingyuan-16","tag":"修辭","stem":"「東風夜放花千樹」中，「東風」的作用是：","options":["表示天氣溫暖","點明季節","以春風吹開萬樹繁花喻燈火之盛，化靜為動","寫風力之大"],"answer":2,"explain":"燈本靜物，以「東風吹放」寫之，遂成千樹花開之奇景，想像極為新穎。","src":"模擬題"},{"id":"A-qingyuan-17","tag":"修辭","stem":"「更吹落、星如雨」運用的修辭手法是：","options":["借代","擬人","誇張","比喻，以星雨喻煙花紛落"],"answer":3,"explain":"以流星如雨比喻煙花墜落，狀其紛紛而下之態，是寫元宵煙火的經典名句。","src":"模擬題"},{"id":"A-qingyuan-18","tag":"結構","stem":"本詞上片與下片的分工是：","options":["上片寫人，下片寫景","上下片皆寫景","上片寫元宵景物，下片寫觀燈之人並點出「那人」","上下片皆議論"],"answer":2,"explain":"上片極寫燈、車、樂、舞之盛，下片由眾女轉入「那人」，層次分明。","src":"模擬題"},{"id":"A-qingyuan-19","tag":"修辭","stem":"「眾裏尋他千百度」中的「千百」運用的是：","options":["誇張，極言尋覓次數之多","對比","對偶","實數"],"answer":0,"explain":"「千百度」非實指，乃誇張其多，凸顯尋覓之艱與得見之喜。","src":"模擬題"},{"id":"A-qingyuan-20","tag":"主旨","stem":"綜合全詞，作者寄寓的核心是：","options":["對繁華易逝的感慨","對愛情的執著追求","元宵夜的遊樂之樂","寧可寂寞自守，亦不隨波逐流的高潔品格"],"answer":3,"explain":"王國維曾引此句喻古今成大事業者的第三重境界，然就本詞而言，核心仍在自甘寂寞、堅守理想。","src":"模擬題"}]}]}]};

<script src="extra-questions.js" onerror="window.__noExtra=true"></script>

<script>
/* ---------------- 合併外部題庫 ---------------- */
function mergeBank(extra){
  if(!extra) return;
  if(!Array.isArray(extra)){
    if(extra.sections){ extra = extra.sections; } else { return; }
  }
  if(extra.length && extra[0] && extra[0].groups){
    extra.forEach(function(ns){
      var exist = BANK.sections.find(function(s){return s.id===ns.id;});
      if(!exist){ BANK.sections.push(ns); return; }
      (ns.groups||[]).forEach(function(ng){
        var eg = exist.groups.find(function(g){return g.id===ng.id;});
        if(!eg){ exist.groups.push(ng); }
        else { ng.questions.forEach(function(q){ if(!eg.questions.find(function(x){return x.id===q.id;})) eg.questions.push(q); }); }
      });
    });
  } else {
    extra.forEach(function(q){
      var sid = q.section || "X", stitle = q.sectionTitle || "自訂課題";
      var gid = q.group || "X-g", gtitle = q.groupTitle || "未命名課題";
      var s = BANK.sections.find(function(x){return x.id===sid;});
      if(!s){ s={id:sid,title:stitle,desc:"",groups:[]}; BANK.sections.push(s); }
      var g = s.groups.find(function(x){return x.id===gid;});
      if(!g){ g={id:gid,title:gtitle,sub:"",questions:[]}; s.groups.push(g); }
      if(!g.questions.find(function(x){return x.id===q.id;})) g.questions.push(q);
    });
  }
}
try{ if(window.EXTRA_BANK) mergeBank(window.EXTRA_BANK); }catch(e){}
try{ var rawArr = JSON.parse(localStorage.getItem('dse_p1_custom_raw')||'[]'); rawArr.forEach(function(t){ try{ mergeBank(JSON.parse(t)); }catch(e){} }); }catch(e){}

/* ---------------- 索引 ---------------- */
var ALL = [];
function reindex(){
  ALL.length=0;
  BANK.sections.forEach(function(s){ s.groups.forEach(function(g){ g.questions.forEach(function(q){ q._s=s; q._g=g; ALL.push(q); }); }); });
}
reindex();
function byId(id){ return ALL.find(function(q){return q.id===id;}); }

/* ---------------- 記錄 ---------------- */
var REC_KEY='dse_p1_record_v2';
var rec = {};
try{ rec = JSON.parse(localStorage.getItem(REC_KEY)||'{}'); }catch(e){ rec={}; }
function saveRec(){ try{ localStorage.setItem(REC_KEY, JSON.stringify(rec)); }catch(e){} }
function recOf(id){ return rec[id] || {t:0,c:0}; }
function pushRec(id, ok){ var r=recOf(id); r.t++; if(ok) r.c++; rec[id]=r; saveRec(); }
function groupStats(g){
  var t=0,c=0;
  g.questions.forEach(function(q){ var r=recOf(q.id); t+=r.t; c+=r.c; });
  return {t:t,c:c,rate: t? Math.round(c/t*100) : null};
}

/* ---------------- 狀態 ---------------- */
var view='practice', cur=null, idx=0, order=[], picked=null, locked=false, sess={right:0,wrong:0}, timer=null, secLeft=0, timed=false;

function $(id){return document.getElementById(id);}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(v){
  view=v; stopTimer();
  ['practice','wrong','stat','io'].forEach(function(k){ $('nav-'+k).className = (k===v?'on':''); });
  if(v==='practice'){ if(cur && idx<order.length){ renderPractice(); return; } renderHome(); }
  if(v==='wrong') renderWrong();
  if(v==='stat') renderStat();
  if(v==='io') renderIO();
}

/* ---------------- 課題首頁 ---------------- */
function renderHome(){
  cur=null; var h='';
  BANK.sections.forEach(function(s){
    var tot=0; s.groups.forEach(function(g){ tot+=g.questions.length; });
    h+='<h2 class="sec">'+esc(s.title)+' · 共 '+tot+' 題</h2><div class="grid">';
    s.groups.forEach(function(g){
      var st=groupStats(g);
      h+='<div class="item" onclick="openGroup(\''+s.id+'\',\''+g.id+'\')">'
        +'<div class="t">'+esc(g.title)+'</div>'
        +'<div class="m">'+g.questions.length+' 題'+(st.t?(' · 正確率 '+st.rate+'%'):' · 未練習')+'</div>'
        +(st.rate!==null?'<div class="bar"><i style="width:'+st.rate+'%"></i></div>':'')
        +'</div>';
    });
    h+='</div>';
  });
  h+='<div class="card"><div class="hint">全站共 '+ALL.length+' 題。題庫更新日期：'+esc(BANK.updated)+'。<br>'
   +'甲部考核 12 篇指定文言經典學習材料，唐詩三首、詞三首已分拆為單篇，方便逐篇針對練習。<br>'
   +'卷一佔全科 40%、考試 1 小時 30 分鐘；甲部佔全卷 30%，建議用時約 20–25 分鐘。</div></div>';
  $('app').innerHTML=h;
}

function openGroup(sid,gid){
  var s=BANK.sections.find(function(x){return x.id===sid;});
  var g=s.groups.find(function(x){return x.id===gid;});
  var st=groupStats(g);
  var tags={};
  g.questions.forEach(function(q){ tags[q.tag]=(tags[q.tag]||0)+1; });
  var h='<div class="card"><div style="font-size:18px;font-weight:700">'+esc(g.title)+'</div>'
   +'<div class="hint">'+esc(g.sub||'')+' ｜ '+g.questions.length+' 題'
   +(st.t?(' ｜ 已練 '+st.t+' 次，正確率 '+st.rate+'%'):'')+'</div>'
   +'<div style="margin-top:8px">'+Object.keys(tags).map(function(k){return '<span class="tag g">'+esc(k)+' '+tags[k]+'</span>';}).join('')+'</div>'
   +'<div class="btns"><button class="btn" onclick="start(\''+sid+'\',\''+gid+'\',0)">順序練習</button>'
   +'<button class="btn ghost" onclick="start(\''+sid+'\',\''+gid+'\',1)">隨機練習</button></div>'
   +'<div class="btns"><button class="btn ghost" onclick="start(\''+sid+'\',\''+gid+'\',1,1)">計時模擬（每題 45 秒）</button></div>'
   +'<div class="btns"><button class="btn ghost" onclick="renderHome()">← 返回課題列表</button></div></div>';
  $('app').innerHTML=h;
}

function start(sid,gid,shuffle,isTimed){
  var s=BANK.sections.find(function(x){return x.id===sid;});
  var g=s.groups.find(function(x){return x.id===gid;});
  cur=g; cur._s=s; order=g.questions.map(function(_,i){return i;});
  if(shuffle) order.sort(function(){return Math.random()-0.5;});
  idx=0; sess={right:0,wrong:0}; timed=!!isTimed;
  if(timed){ secLeft = order.length*45; startTimer(); }
  renderPractice();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    secLeft--; var el=$('tmr'); if(el) el.textContent = '⏱ '+Math.floor(secLeft/60)+':'+('0'+(secLeft%60)).slice(-2);
    if(secLeft<=0){ stopTimer(); autoFinish(); }
  },1000);
}
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function autoFinish(){ locked=true; renderResult(); }

/* ---------------- 練習 ---------------- */
function renderPractice(){
  if(idx>=order.length){ renderResult(); return; }
  var q=cur.questions[order[idx]]; picked=null; locked=false;
  var h='<div class="topbar"><span>'+esc(cur.title)+'　'+ (idx+1)+'/'+order.length +'</span>'
   +'<span><span class="pill">✅ '+sess.right+'</span> <span class="pill">❌ '+sess.wrong+'</span>'
   +(timed?' <span class="pill" id="tmr">⏱ '+Math.floor(secLeft/60)+':'+('0'+(secLeft%60)).slice(-2)+'</span>':'')+'</span></div>';

  h+='<div class="qwrap">';
  if(q.passage) h+='<div class="passage">'+esc(q.passage)+'</div>';
  h+='<div class="qmeta"><span class="tag">'+esc(q.tag)+'</span>'+(q.src?('<span class="tag g">'+esc(q.src)+'</span>'):'')+'</div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  h+='<div id="opts">'+q.options.map(function(o,i){
      return '<div class="opt" onclick="pick('+i+')"><span class="k">'+'ABCD'[i]+'.</span><span>'+esc(o)+'</span></div>';
    }).join('')+'</div>';
  h+='<div id="exp"></div>';
  h+='<div class="btns"><button class="btn ghost" onclick="quit()">結束</button>'
   +'<button class="btn" id="nextBtn" onclick="nextQ()" style="display:none">下一題 →</button></div>';
  h+='</div>';
  $('app').innerHTML=h;
}

function pick(i){
  if(locked) return;
  var q=cur.questions[order[idx]];
  picked=i; locked=true;
  var ok = (i===q.answer);
  if(ok) sess.right++; else sess.wrong++;
  pushRec(q.id, ok);
  var nodes=document.querySelectorAll('#opts .opt');
  for(var k=0;k<nodes.length;k++){
    nodes[k].classList.add('locked');
    if(k===q.answer) nodes[k].classList.add('right');
    else if(k===i) nodes[k].classList.add('wrong');
  }
  $('exp').innerHTML='<div class="explain">'+(ok?'<b>✅ 答對了</b>':'<b>❌ 答錯了，正確答案是 '+'ABCD'[q.answer]+'</b>')
    +'<br>'+esc(q.explain)+'</div>';
  $('nextBtn').style.display='';
}
function nextQ(){ idx++; renderPractice(); }
function quit(){ stopTimer(); renderResult(); }

function renderResult(){
  var total=sess.right+sess.wrong;
  var rate = total? Math.round(sess.right/total*100):0;
  var h='<div class="card score"><div style="font-size:14px;color:var(--sub)">'+esc(cur.title)+' 練習完成</div>'
   +'<div class="n">'+rate+'%</div>'
   +'<div class="hint">答對 '+sess.right+' 題 / 共 '+total+' 題</div>'
   +'<div class="btns"><button class="btn" onclick="start(\''+cur._s.id+'\',\''+cur.id+'\',1)">再練一次（隨機）</button>'
   +'<button class="btn ghost" onclick="renderHome()">返回課題</button></div></div>';
  var wrongList = ALL.filter(function(q){ var r=recOf(q.id); return r.t>0 && r.c<r.t; });
  h+='<div class="card"><div style="font-weight:700;margin-bottom:6px">錯題本現況</div>'
   +'<div class="hint">共 '+wrongList.length+' 題曾答錯。'+(wrongList.length?'可到「錯題本」只練錯題。':'')+'</div></div>';
  $('app').innerHTML=h;
  cur=null;
}

/* ---------------- 錯題本 ---------------- */
function renderWrong(){
  var list = ALL.filter(function(q){ var r=recOf(q.id); return r.t>0 && r.c<r.t; });
  var h='<h2 class="sec">錯題本 · '+list.length+' 題</h2>';
  if(!list.length){ $('app').innerHTML=h+'<div class="empty">尚無錯題，先去做幾題吧 🙂</div>'; return; }
  var byG={};
  list.forEach(function(q){ (byG[q._g.id]=byG[q._g.id]||[]).push(q); });
  BANK.sections.forEach(function(s){ s.groups.forEach(function(g){
    if(!byG[g.id]) return;
    h+='<div class="card"><div style="font-weight:700">'+esc(g.title)+' <span class="tag">'+byG[g.id].length+'</span></div>'
      +'<div class="btns"><button class="btn ghost" onclick="redoWrong(\''+g.id+'\')">只練這些錯題</button></div></div>';
  });});
  h+='<div class="btns"><button class="btn ghost" onclick="clearWrong()">清空所有記錄</button></div>';
  $('app').innerHTML=h;
}
function redoWrong(gid){
  var list = ALL.filter(function(q){ var r=recOf(q.id); return q._g.id===gid && r.t>0 && r.c<r.t; });
  if(!list.length) return;
  cur = {id:gid,title:'錯題重做 · '+list[0]._g.title, _s:list[0]._s, questions:list};
  order = list.map(function(_,i){return i;}); order.sort(function(){return Math.random()-0.5;});
  idx=0; sess={right:0,wrong:0}; timed=false; renderPractice();
}
function clearWrong(){
  if(!confirm('確定清空所有答題記錄（含統計與錯題本）？')) return;
  rec={}; saveRec(); renderWrong();
}

/* ---------------- 統計 ---------------- */
function renderStat(){
  var h='<h2 class="sec">各課題統計</h2><div class="card"><table><tr><th>課題</th><th>題數</th><th>已練</th><th>正確率</th></tr>';
  BANK.sections.forEach(function(s){
    s.groups.forEach(function(g){
      var st=groupStats(g);
      h+='<tr><td>'+esc(g.title)+'</td><td>'+g.questions.length+'</td><td>'+st.t+'</td><td>'+(st.rate===null?'—':st.rate+'%')+'</td></tr>';
    });
  });
  h+='</table></div>';
  var tt=0,cc=0; ALL.forEach(function(q){var r=recOf(q.id); tt+=r.t; cc+=r.c;});
  h+='<div class="card"><div style="font-weight:700">總體</div><div class="hint">累計作答 '+tt+' 次，答對 '+cc+' 次'
   +(tt?('，整體正確率 '+Math.round(cc/tt*100)+'%'):'')+'。卷一 90 分鐘，甲部建議用 20–25 分鐘，其餘留給乙部。</div></div>';
  h+='<div class="btns"><button class="btn ghost" onclick="clearWrong()">重置所有記錄</button></div>';
  $('app').innerHTML=h;
}

/* ---------------- 匯入題庫 ---------------- */
function renderIO(){
  var h='<h2 class="sec">後期加題通道</h2>'
  +'<div class="card"><div style="font-weight:700">方式一：編輯 extra-questions.js（推薦）</div>'
  +'<div class="hint">與 index.html 放同一資料夾，刷新頁面即自動合併。打開該檔案可見格式範例。</div></div>'
  +'<div class="card"><div style="font-weight:700">方式二：匯入 JSON 檔案</div>'
  +'<input type="file" accept=".json,.txt" onchange="impFile(this)">'
  +'<div class="hint">支援兩種格式：①題目陣列（每題帶 section／group 欄位）；②完整 sections 結構。</div></div>'
  +'<div class="card"><div style="font-weight:700">方式三：貼上 JSON</div>'
  +'<textarea id="pasteBox" placeholder=\'[{"id":"X-1","section":"A","sectionTitle":"甲部 · 指定文言經典篇章","group":"A-yueyang","groupTitle":"岳陽樓記","tag":"句譯","stem":"題目...","options":["A","B","C","D"],"answer":0,"explain":"解析...","src":"2022 DSE 卷一 甲部 Q3"}]\'></textarea>'
  +'<div class="btns"><button class="btn" onclick="impPaste()">匯入並合併</button>'
  +'<button class="btn ghost" onclick="clearCustom()">清除已匯入題庫</button></div>'
  +'<div class="hint" id="ioMsg">匯入後存於瀏覽器 localStorage，換裝置需重新匯入。</div></div>'
  +'<div class="card"><div style="font-weight:700">題目欄位說明</div>'
  +'<div class="hint">id（唯一）／tag（詞解、句譯、內容理解、寫作手法、修辭、主旨、人物形象、論證手法、句式、文言基礎、古今異義、體裁、深層理解、結構、風格、用典）／stem（題幹）／passage（可選，篇章原文）／options（四個選項）／answer（正確選項序號 0–3）／explain（解析）／src（來源年份）。</div></div>'
  +'<div class="card"><div style="font-weight:700">課題代號對照</div>'
  +'<div class="hint">A-lunren 論仁論孝論君子｜A-yu 魚我所欲也｜A-xiaoyao 逍遙遊｜A-quanxue 勸學｜A-lianpo 廉頗藺相如列傳｜A-chushi 出師表｜A-shishuo 師說｜A-xishan 始得西山宴遊記｜A-yueyang 岳陽樓記｜A-liuguo 六國論｜A-shanju 山居秋暝｜A-yuexia 月下獨酌｜A-denglou 登樓｜A-niannu 念奴嬌｜A-shengsheng 聲聲慢｜A-qingyuan 青玉案</div></div>';
  $('app').innerHTML=h;
}
function doImport(txt){
  try{
    var data=JSON.parse(txt);
    mergeBank(data);
    reindex();
    var arr=[]; try{ arr=JSON.parse(localStorage.getItem('dse_p1_custom_raw')||'[]'); }catch(e){ arr=[]; }
    arr.push(txt);
    localStorage.setItem('dse_p1_custom_raw', JSON.stringify(arr));
    return true;
  }catch(e){ alert('JSON 格式有誤：'+e.message); return false; }
}
function impFile(el){
  var f=el.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ if(doImport(r.result)){ $('ioMsg').textContent='✅ 已匯入，共 '+ALL.length+' 題。'; } };
  r.readAsText(f);
}
function impPaste(){
  var t=$('pasteBox').value.trim(); if(!t){ alert('請先貼上 JSON'); return; }
  if(doImport(t)) $('ioMsg').textContent='✅ 已匯入，共 '+ALL.length+' 題。';
}
function clearCustom(){ localStorage.removeItem('dse_p1_custom_raw'); alert('已清除，刷新頁面後恢復原始題庫。'); }

renderHome();
</script>
</body>
</html>
